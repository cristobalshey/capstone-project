<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack - Notifications</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { 
            --primary-neutral: #444444; 
            --accent-neutral: #888888; 
            --bg-soft: #fcfcfc; 
            --card-bg: #ffffff;
            --border-soft: #f0f0f0;
            --text-main: #444444; 
            --text-muted: #888888; 
            --radius-lg: 16px;
            --radius-md: 12px;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.02);
            --sidebar-width: 85px; 
            --danger-red: #d32f2f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Baloo Da 2', cursive; 
            background-color: var(--bg-soft); 
            color: var(--text-main); 
            display: flex; 
            min-height: 100vh; 
            font-size: 16px; 
            letter-spacing: -0.01em;
        }

        /* --- Sidebar (Icon-only) --- */
        .sidebar { 
            width: var(--sidebar-width); 
            background-color: var(--card-bg); 
            height: 100vh; 
            position: fixed; 
            left: 0; 
            top: 0; 
            border-right: 1px solid var(--border-soft); 
            display: flex; 
            flex-direction: column; 
            padding: 32px 0; 
            z-index: 1000; 
            overflow: hidden; 
            transition: all 0.3s ease; 
        }
        
        .sidebar-brand { 
            padding: 0 20px 48px 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            transition: all 0.3s ease; 
        }
        
        .sidebar-logo-img { height: 1.5rem; width: auto; display: block; opacity: 0.8; }
        
        .nav-menu { list-style: none; flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 0 16px; }
        
        .nav-link { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 14px; 
            color: var(--text-muted); 
            text-decoration: none; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            border-radius: var(--radius-md);
        }
        
        .nav-link i { 
            font-size: 1.2rem; 
            color: var(--text-muted);
            transition: all 0.25s;
        }
        
        .nav-link:hover { 
            background-color: var(--bg-soft); 
            color: var(--text-main); 
        }
        .nav-link:hover i { transform: scale(1.1); color: var(--text-main); }
        
        .nav-link.active { 
            color: var(--text-main); 
            background-color: var(--bg-soft);
            box-shadow: inset 0 0 0 1px var(--border-soft);
        }
        .nav-link.active i { color: var(--text-main); }

        .sidebar-brand span, .nav-link span { display: none; }

        .logout-item { margin-top: auto; border-top: 1px solid var(--border-soft); padding-top: 16px; margin-top: 16px; }
        .logout-link { color: var(--text-muted) !important; }
        .logout-link:hover { color: #d32f2f !important; }

        /* --- Main Content --- */
        .main { margin-left: var(--sidebar-width); flex: 1; padding: 40px 48px; transition: margin-left 0.3s ease; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .title h1 { font-size: 1.8rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.02em; }
        .title p { color: var(--text-muted); margin-top: 4px; font-size: 0.9rem; }


        /* --- Content Grid --- */
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr; /* 2/3 List, 1/3 Compose */
            gap: 25px;
        }

        /* --- Notification List Card --- */
        .card {
            background: var(--card-bg); border-radius: var(--radius-lg);
            box-shadow: var(--card-shadow); border: 1px solid var(--border-soft);
            overflow: hidden; display: flex; flex-direction: column;
        }
        .card-header {
            padding: 24px 32px; border-bottom: 1px solid var(--border-soft);
            display: flex; justify-content: space-between; align-items: center;
        }
        .card-title { font-size: 1.1rem; font-weight: 600; color: var(--text-main); letter-spacing: -0.01em; }

        /* Filters */
        .notif-filters { display: flex; gap: 8px; }
        .filter-pill {
            padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
            border: 1px solid var(--border-soft); background: var(--bg-soft); color: var(--text-muted); transition: 0.2s;
        }
        .filter-pill:hover { background: var(--border-soft); color: var(--text-main); }
        .filter-pill.active { background: var(--text-main); color: white; border-color: var(--text-main); }

        /* List Items */
        .notif-list { list-style: none; max-height: 600px; overflow-y: auto; }
        .notif-item {
            padding: 16px 24px; border-bottom: 1px solid #f5f5f5;
            display: flex; gap: 15px; align-items: start; transition: background 0.2s; position: relative;
        }
        .notif-item:hover { background-color: #fafafa; }
        .notif-item.unread { background-color: #f0fdf4; border-left: 4px solid var(--primary); }

        .notif-icon {
            width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; flex-shrink: 0;
        }
        .icon-alert { background: #ffebee; color: var(--danger); }
        .icon-info { background: #e3f2fd; color: var(--info); }
        .icon-success { background: #e8f5e9; color: var(--primary); }
        .icon-warn { background: #fff3e0; color: var(--warning); }

        .notif-content { flex: 1; }
        .notif-head { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .notif-msg { font-size: 0.9rem; color: #444; line-height: 1.4; }
        .notif-time { font-size: 0.75rem; color: #999; font-weight: 500; }
        .notif-tag { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: #777; }

        .notif-actions { display: flex; gap: 10px; margin-top: 8px; }
        .btn-link { background: none; border: none; font-size: 0.8rem; font-weight: 600; cursor: pointer; padding: 0; color: var(--primary); }
        .btn-link:hover { text-decoration: underline; }
        .btn-link.danger { color: #aaa; }
        .btn-link.danger:hover { color: var(--danger); }

        /* --- Compose Area (Right Side) --- */
        .compose-form { padding: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 500; margin-bottom: 5px; font-size: 0.85rem; }
        input, select, textarea {
            width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px;
            font-family: inherit; font-size: 0.9rem;
        }
        textarea { resize: vertical; height: 120px; }
        
        .btn-send {
            width: 100%; background: #2e7d32; color: white; padding: 12px;
            border: none; border-radius: 8px; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.25s ease; font-size: 0.95rem;
        }
        .btn-send:hover { background: #256629; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(46,125,50,0.2); }

        /* Toast */
        .toast {
            position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white;
            padding: 15px 25px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: translateY(100px); transition: transform 0.3s ease; font-weight: 600;
        }
        .toast.show { transform: translateY(0); }

        @media (max-width: 1000px) {
            .content-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="sidebar">
    <div class="sidebar-brand"><img src="image/logo.png" alt="Logo" class="sidebar-logo-img"> <span>EcoTrack</span></div>
    <ul class="nav-menu">
        <li class="nav-item"><a href="admin_dashboard.html" class="nav-link"><i class="fa-solid fa-gauge"></i> <span>Dashboard</span></a></li>
        <li class="nav-item"><a href="admin_users_hub.html" class="nav-link"><i class="fa-solid fa-users-gear"></i> <span>User Hub</span></a></li>
        <li class="nav-item"><a href="admin_projects_hub.html" class="nav-link"><i class="fa-solid fa-diagram-project"></i> <span>Project Hub</span></a></li>
        <li class="nav-item"><a href="admin_financial_hub.html" class="nav-link"><i class="fa-solid fa-wallet"></i> <span>Financial Hub</span></a></li>
        <li class="nav-item logout-item"><a href="#" onclick="logout()" class="nav-link logout-link"><i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span></a></li>
    </ul>
</nav>

    <div class="main">
        
        <div class="header">
            <div class="title">
                <h1>Notification Center</h1>
                <p>Alerts & Community Announcements</p>
            </div>

        </div>

        <div class="content-grid">
            
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Recent Alerts</span>
                    <div class="notif-filters">
                        <span class="filter-pill active" onclick="filterNotifs('all')">All</span>
                        <span class="filter-pill" onclick="filterNotifs('unread')">Unread</span>
                        <span class="filter-pill" onclick="filterNotifs('urgent')">Urgent</span>
                    </div>
                </div>
                
                <ul class="notif-list" id="notifList">
                    <li style="padding: 20px; text-align: center; color: #999;">
                        <i class="fa-solid fa-spinner fa-spin"></i> Loading notifications...
                    </li>
                </ul>
                <div style="padding: 15px; text-align: center; border-top: 1px solid #eee;">
                    <button class="btn-link" style="font-size: 0.9rem;" onclick="clearAll()">Clear All Notifications</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">Send Broadcast</span>
                </div>
                <div class="compose-form">
                    <form onsubmit="sendBroadcast(event)">
                        <div class="form-group">
                            <label>Target Audience</label>
                            <select id="targetAudience">
                                <option value="all">All Residents (Push & SMS)</option>
                                <option value="purok1">Purok 1 Only</option>
                                <option value="purok2">Purok 2 Only</option>
                                <option value="purok3">Purok 3 Only</option>
                                <option value="purok4">Purok 4 Only</option>
                                <option value="purok5">Purok 5 Only</option>
                                <option value="staff">Eco-Patrollers / Staff Only</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Subject / Title</label>
                            <input type="text" id="notifTitle" placeholder="e.g. Garbage Truck Delay" required>
                        </div>
                        <div class="form-group">
                            <label>Message</label>
                            <textarea id="notifMessage" placeholder="Type your announcement here..." required></textarea>
                        </div>
                        <button type="submit" class="btn-send">
                            <i class="fa-solid fa-paper-plane"></i> Send Announcement
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check"></i> Announcement Sent Successfully!
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase_config.js"></script>
    <script>
        let allNotifications = [];

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', loadNotificationsFromDB);

        // --- Load Notifications from Database ---
        async function loadNotificationsFromDB() {
            if (!window.supabaseClient) {
                console.error('Supabase client not initialized');
                return;
            }

            try {
                const { data: notifications, error } = await window.supabaseClient
                    .from('notifications')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error('Failed to load notifications:', error);
                    renderNotifications([]);
                    return;
                }

                allNotifications = notifications || [];
                renderNotifications(allNotifications);
            } catch (err) {
                console.error('Unexpected error loading notifications:', err);
                renderNotifications([]);
            }
        }

        // --- Render Notifications ---
        function renderNotifications(notifications) {
            const list = document.getElementById('notifList');
            
            if (!notifications || notifications.length === 0) {
                list.innerHTML = '<li style="padding: 20px; text-align: center; color: #999;">No notifications yet.</li>';
                return;
            }

            list.innerHTML = notifications.map(notif => {
                const createdAt = new Date(notif.created_at);
                const timeAgo = formatTimeAgo(createdAt);
                const icon = getIconForType(notif.type);

                return `
                    <li class="notif-item" data-notif-id="${notif.id}">
                        <div class="notif-icon ${icon.class}"><i class="${icon.icon}"></i></div>
                        <div class="notif-content">
                            <div class="notif-head">
                                <span class="notif-tag">${notif.broadcast_target ? getTargetLabel(notif.broadcast_target) : 'Broadcast'}</span>
                                <span class="notif-time">${timeAgo}</span>
                            </div>
                            <div class="notif-msg"><b>${escapeHtml(notif.title)}</b>: ${escapeHtml(notif.description)}</div>
                        </div>
                    </li>
                `;
            }).join('');
        }

        // --- Helper: Get Icon for Type ---
        function getIconForType(type) {
            switch(type) {
                case 'alert':
                case 'urgent':
                    return { icon: 'fa-solid fa-triangle-exclamation', class: 'icon-alert' };
                case 'warning':
                    return { icon: 'fa-solid fa-exclamation-circle', class: 'icon-warn' };
                case 'success':
                    return { icon: 'fa-solid fa-check-circle', class: 'icon-success' };
                case 'broadcast':
                default:
                    return { icon: 'fa-solid fa-bullhorn', class: 'icon-info' };
            }
        }

        // --- Helper: Get Target Label ---
        function getTargetLabel(target) {
            const labels = {
                'all': 'All Residents',
                'purok1': 'Purok 1',
                'purok2': 'Purok 2',
                'purok3': 'Purok 3',
                'purok4': 'Purok 4',
                'purok5': 'Purok 5',
                'staff': 'Staff'
            };
            return labels[target] || target;
        }

        // --- Helper: Format Time Ago ---
        function formatTimeAgo(date) {
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);

            if (seconds < 60) return 'Just now';
            if (seconds < 3600) return Math.floor(seconds / 60) + ' mins ago';
            if (seconds < 86400) return Math.floor(seconds / 3600) + ' hrs ago';
            return Math.floor(seconds / 86400) + ' days ago';
        }

        // --- Helper: Escape HTML ---
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // --- 1. Filter Logic ---
        function filterNotifs(type) {
            // UI Update
            document.querySelectorAll('.filter-pill').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');

            if (type === 'all') {
                renderNotifications(allNotifications);
            } else if (type === 'unread') {
                // You can add read/unread logic later with a column in DB
                renderNotifications(allNotifications);
            } else if (type === 'urgent') {
                renderNotifications(allNotifications.filter(n => n.type === 'urgent' || n.type === 'alert'));
            }
        }

        // --- 2. Clear All ---
        async function clearAll() {
            const result = await Swal.fire({
                title: 'Delete All Notifications?',
                text: 'This action cannot be undone. All notifications will be permanently deleted from the database.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d32f2f',
                cancelButtonColor: '#757575',
                confirmButtonText: 'Yes, Delete All',
                cancelButtonText: 'Cancel'
            });

            if (!result.isConfirmed) return;

            try {
                // Delete all notifications from Supabase
                const { error } = await window.supabaseClient
                    .from('notifications')
                    .delete()
                    .gte('created_at', '1900-01-01T00:00:00Z');

                if (error) {
                    Swal.fire({
                        title: 'Error',
                        text: `Failed to clear notifications: ${error.message}`,
                        icon: 'error',
                        confirmButtonColor: '#d32f2f'
                    });
                    console.error('Delete error:', error);
                    return;
                }

                allNotifications = [];
                renderNotifications([]);
                
                Swal.fire({
                    title: 'Deleted!',
                    text: 'All notifications have been permanently removed.',
                    icon: 'success',
                    confirmButtonColor: '#2e7d32'
                });
            } catch (err) {
                console.error('Error clearing notifications:', err);
                Swal.fire({
                    title: 'Error',
                    text: `Unexpected error: ${err.message}`,
                    icon: 'error',
                    confirmButtonColor: '#d32f2f'
                });
            }
        }

        // --- 3. Send Broadcast ---
        async function sendBroadcast(e) {
            e.preventDefault();
            
            if (!window.supabaseClient) {
                Swal.fire('Error', 'Supabase client not initialized', 'error');
                return;
            }

            const title = document.getElementById('notifTitle').value;
            const msg = document.getElementById('notifMessage').value;
            const targetValue = document.getElementById('targetAudience').value;
            const targetText = document.getElementById('targetAudience').options[document.getElementById('targetAudience').selectedIndex].text;

            try {
                // Insert into notifications table
                const { data, error } = await window.supabaseClient
                    .from('notifications')
                    .insert({
                        user_id: null,  // NULL for broadcasts
                        title: title,
                        description: msg,
                        type: 'broadcast',
                        broadcast_target: targetValue === 'all' ? 'all' : targetValue,
                        created_at: new Date().toISOString()
                    });

                if (error) {
                    Swal.fire('Error', `Failed to send broadcast: ${error.message}`, 'error');
                    console.error('Broadcast error:', error);
                    return;
                }

                // Show Success Toast
                const toast = document.getElementById('toast');
                toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> Sent to ${targetText}!`;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);

                // Reload notifications
                loadNotificationsFromDB();

                // Reset Form
                e.target.reset();
            } catch (err) {
                Swal.fire('Error', `Unexpected error: ${err.message}`, 'error');
                console.error('Broadcast error:', err);
            }
        }

        async function logout() {
            const result = await Swal.fire({
                title: 'Logout?',
                text: "Are you sure you want to sign out?",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#02451A',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Yes, Logout'
            });

            if (result.isConfirmed) {
                window.location.href = "login.html";
            }
        }
    </script>
</body>
</html>

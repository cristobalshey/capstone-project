<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack | Set Your Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase_config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --primary-green: #02451A;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(2, 69, 26, 0.1);
            --text-main: #02451A;
            --text-muted: rgba(2, 69, 26, 0.6);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f0fdf4;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px; overflow: hidden; position: relative;
        }

        /* --- Ambient Background --- */
        .ambient-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; pointer-events: none;
        }
        .ambient-blob {
            position: absolute; border-radius: 50%; filter: blur(80px);
            opacity: 0.4; animation: move 20s infinite alternate;
        }
        .blob-1 { width: 400px; height: 400px; background: #86efac; top: -100px; left: -100px; }
        .blob-2 { width: 350px; height: 350px; background: #bbf7d0; bottom: -100px; right: -100px; animation-delay: -5s; }
        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(50px, 50px) scale(1.1); }
        }

        .setup-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(2, 69, 26, 0.15);
            text-align: center;
            z-index: 10;
            position: relative;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .header-icon { font-size: 3.5rem; margin-bottom: 20px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1)); }
        h1 { color: var(--text-main); font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 32px; font-weight: 500; }

        .form-container { display: flex; flex-direction: column; gap: 20px; }
        
        .form-group { text-align: left; width: 100%; }
        .form-label { 
            display: block; font-size: 13px; font-weight: 800; color: var(--text-muted); 
            text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; margin-left: 4px;
        }
        
        .form-control {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1.5px solid rgba(2, 69, 26, 0.1);
            background: rgba(255, 255, 255, 0.8);
            color: var(--text-main);
            font-family: inherit; font-size: 15px; font-weight: 600;
            outline: none; transition: all 0.25s ease;
            box-shadow: inset 0 2px 4px rgba(2, 69, 26, 0.02);
        }
        .form-control:focus {
            border-color: var(--primary-green);
            background: white;
            box-shadow: 0 0 0 4px rgba(2, 69, 26, 0.08);
            transform: translateY(-1px);
        }

        .btn-save {
            width: 100%;
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px -5px rgba(2, 69, 26, 0.3);
            margin-top: 10px;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 15px 30px -5px rgba(2, 69, 26, 0.45); }
        .btn-save:active { transform: translateY(0); }
        .btn-save:disabled { opacity: 0.7; cursor: not-allowed; }
        
        /* Password Strength */
        .strength-container { margin-top: -10px; display: none; align-items: center; gap: 8px; padding-left: 4px; margin-bottom: 10px; }
        .strength-bar { flex-grow: 1; height: 4px; background: rgba(2, 69, 26, 0.1); border-radius: 2px; overflow: hidden; }
        .strength-fill { height: 100%; width: 0; transition: all 0.3s ease; }
        .strength-text { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .strength-weak { background: #ef4444; }
        .strength-strong { background: #10b981; }
        .text-weak { color: #ef4444; }
        .text-strong { color: #10b981; }
    </style>
    <style>
        /* --- LOADING OVERLAY --- */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #f0fdf4;
            z-index: 3000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .spinner-shield {
            font-size: 5rem;
            animation: pulse 1.5s infinite ease-in-out;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .loading-title {
            color: #02451A;
            font-weight: 800;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .loading-subtitle {
            color: #64748b;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner-shield">💎</div>
        <div class="loading-title">Finalizing Profile...</div>
        <div class="loading-subtitle">Optimizing your secure eco-dashboard</div>
    </div>

    <div class="ambient-layer">
        <div class="ambient-blob blob-1"></div>
        <div class="ambient-blob blob-2"></div>
    </div>

    <div class="setup-card">
        <div class="header-icon">🔐</div>
        <h1>Secure Your Account</h1>
        <p class="subtitle">Since you're using Google, please set a master password to enable all EcoTrack security features.</p>

        <form class="form-container" onsubmit="handleSetPassword(event)">
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required oninput="checkStrength(this.value)">
            </div>
            
            <div class="strength-container" id="strengthContainer">
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <span class="strength-text" id="strengthText">Weak</span>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-save" id="saveBtn">Create Master Password</button>
        </form>
    </div>

    <script>
        function checkStrength(val) {
            const container = document.getElementById('strengthContainer');
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');
            
            if (!val) {
                container.style.display = 'none';
                return;
            }
            
            container.style.display = 'flex';
            const hasUpper = /[A-Z]/.test(val);
            const isLongEnough = val.length >= 8;
            
            if (hasUpper && isLongEnough) {
                fill.className = 'strength-fill strength-strong';
                fill.style.width = '100%';
                text.innerText = 'Strong';
                text.className = 'strength-text text-strong';
            } else {
                fill.className = 'strength-fill strength-weak';
                fill.style.width = '33%';
                text.innerText = 'Weak';
                text.className = 'strength-text text-weak';
            }
        }

        async function handleSetPassword(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('saveBtn');

            const hasUpper = /[A-Z]/.test(password);
            if (password.length < 8 || !hasUpper) {
                Swal.fire('Weak Password', 'Your password must be at least 8 characters long and contain at least one uppercase letter.', 'error');
                return;
            }

            if (password !== confirm) {
                Swal.fire('Mismatch', 'Passwords do not match!', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerText = "Setting Master Password...";

            // 1. Update Supabase Auth Password (This makes it the official login password)
            const { error: authError } = await window.supabaseClient.auth.updateUser({
                password: password
            });

            if (authError) {
                Swal.fire('Error', authError.message, 'error');
                btn.disabled = false;
                btn.innerText = "Create Password";
                return;
            }

            // 2. Update Profile marker (and store manual password reference)
            const { data: { user } } = await window.supabaseClient.auth.getUser();
            const { error: profileError } = await window.supabaseClient
                .from('profiles')
                .update({ 
                    has_password: true,
                    pass_code: password 
                })
                .eq('id', user.id);

            if (profileError) {
                Swal.fire('Error', profileError.message, 'error');
                btn.disabled = false;
                btn.innerHTML = 'Create Master Password';
            } else {
                // Show Loading Sync
                document.getElementById('loadingOverlay').style.display = 'flex';
                
                setTimeout(() => {
                    window.location.href = "menu.html";
                }, 3000);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EcoTrack | Task History</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary-green: #02451A;
            --bg-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(2, 69, 26, 0.1);
            --card-shadow: 0 8px 32px -8px rgba(2, 69, 26, 0.1);
            --text-main: #02451A;
            --text-muted: rgba(2, 69, 26, 0.6);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100svh; overflow: hidden; position: relative;
        }

        .ambient-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(2, 69, 26, 0.05), transparent 50%),
                        radial-gradient(circle at 85% 30%, rgba(2, 69, 26, 0.08), transparent 50%);
        }

        .app-container {
            width: 100%; max-width: 480px; height: 100vh; height: 100svh; display: flex; flex-direction: column; position: relative;
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 0 50px rgba(0,0,0,0.05); overflow: hidden;
        }

        /* Header */
        .header {
            padding: 24px 24px 15px 24px; display: flex; align-items: center; justify-content: space-between; z-index: 10;
        }

        .back-btn {
            background: var(--glass-bg); border: 1px solid var(--glass-border); width: 42px; height: 42px; border-radius: 14px;
            display: flex; justify-content: center; align-items: center; color: var(--primary-green); cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 69, 26, 0.05); transition: all 0.3s ease;
        }

        .back-btn:hover { background: white; transform: translateX(-3px); box-shadow: 0 6px 15px rgba(2, 69, 26, 0.1); }
        .header-title { font-size: 20px; font-weight: 800; color: var(--primary-green); }

        /* Content Area */
        .history-content {
            flex-grow: 1; padding: 10px 24px 40px 24px; overflow-y: auto; scrollbar-width: none;
            display: flex; flex-direction: column; gap: 20px;
        }
        .history-content::-webkit-scrollbar { display: none; }

        /* Filter Chips */
        .filter-row {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none;
            margin-top: 5px; margin-bottom: 5px; animation: slideIn 0.5s ease backwards;
        }
        .filter-row::-webkit-scrollbar { display: none; }
        
        .filter-chip {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 8px 16px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer;
            white-space: nowrap; transition: all 0.2s ease; font-family: inherit;
        }
        .filter-chip.active {
            background: var(--primary-green); color: white; border-color: transparent; box-shadow: 0 4px 12px rgba(2, 69, 26, 0.2);
        }

        /* Activity List */
        .date-divider {
            font-size: 13px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;
            margin-top: 15px; margin-bottom: 0px; animation: slideIn 0.5s ease 0.1s backwards;
        }
        
        .activity-list { display: flex; flex-direction: column; gap: 12px; animation: slideIn 0.5s ease 0.2s backwards; }
        
        .activity-item {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 15px;
            display: flex; align-items: center; gap: 15px; box-shadow: var(--card-shadow); transition: transform 0.2s;
        }
        .activity-item:hover { transform: translateY(-2px); }
        
        .act-icon {
            width: 42px; height: 42px; border-radius: 12px; display: flex; justify-content: center; align-items: center; flex-shrink: 0;
        }
        .act-icon.quiz { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .act-icon.mission { background: rgba(2, 69, 26, 0.1); color: var(--primary-green); }
        .act-icon.manual { background: rgba(234, 179, 8, 0.1); color: #eab308; }
        
        .act-details { flex-grow: 1; }
        .act-title { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
        .act-time { font-size: 11px; font-weight: 600; color: var(--text-muted); }
        
        .act-points {
            font-size: 14px; font-weight: 800; color: var(--primary-green); background: rgba(2, 69, 26, 0.05); padding: 4px 8px; border-radius: 8px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>

<body>
    <div class="ambient-layer"></div>

    <div class="app-container">
        
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="back-btn" onclick="window.location.href='stat.html'">
                    <i data-lucide="chevron-left"></i>
                </button>
            </div>
            <div class="header-title">Task History</div>
            <div style="width: 42px;"></div> <!-- Spacer -->
        </header>

        <main class="history-content">
            
            <div class="filter-row">
                <button class="filter-chip active">All Tasks</button>
                <button class="filter-chip">Missions</button>
                <button class="filter-chip">Manual</button>
                <button class="filter-chip">Quizzes</button>
            </div>

            <!-- Today -->
            <div class="date-divider">Today</div>
            <div class="activity-list">
                <div class="activity-item">
                    <div class="act-icon mission"><i data-lucide="target"></i></div>
                    <div class="act-details">
                        <div class="act-title">Beach Cleanup Mission</div>
                        <div class="act-time">10:30 AM</div>
                    </div>
                    <div class="act-points">+150</div>
                </div>
            </div>

            <!-- Yesterday -->
            <div class="date-divider">Yesterday</div>
            <div class="activity-list">
                <div class="activity-item">
                    <div class="act-icon manual"><i data-lucide="hand"></i></div>
                    <div class="act-details">
                        <div class="act-title">Recycled 5 PET Bottles</div>
                        <div class="act-time">2:15 PM</div>
                    </div>
                    <div class="act-points">+25</div>
                </div>

                <div class="activity-item">
                    <div class="act-icon manual"><i data-lucide="hand"></i></div>
                    <div class="act-details">
                        <div class="act-title">Composted Kitchen Waste</div>
                        <div class="act-time">11:00 AM</div>
                    </div>
                    <div class="act-points">+50</div>
                </div>
            </div>

            <!-- This Week -->
            <div class="date-divider">This Week</div>
            <div class="activity-list">
                <div class="activity-item">
                    <div class="act-icon quiz"><i data-lucide="brain"></i></div>
                    <div class="act-details">
                        <div class="act-title">Carbon Footprint Quiz</div>
                        <div class="act-time">Tuesday, 9:00 AM</div>
                    </div>
                    <div class="act-points">+10</div>
                </div>

                <div class="activity-item">
                    <div class="act-icon mission"><i data-lucide="target"></i></div>
                    <div class="act-details">
                        <div class="act-title">Planted a Tree</div>
                        <div class="act-time">Monday, 4:30 PM</div>
                    </div>
                    <div class="act-points">+300</div>
                </div>
                
                <div class="activity-item">
                    <div class="act-icon quiz"><i data-lucide="brain"></i></div>
                    <div class="act-details">
                        <div class="act-title">Energy Savings Quiz</div>
                        <div class="act-time">Sunday, 8:00 AM</div>
                    </div>
                    <div class="act-points">+10</div>
                </div>
            </div>

        </main>
    </div>

    <script>
        lucide.createIcons();

        // Simple mock functionality for filter chips
        document.querySelectorAll('.filter-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
            });
        });
    </script>
</body>

</html>

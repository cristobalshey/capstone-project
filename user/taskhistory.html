<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EcoTrack | Task History</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase_config.js"></script>

    <style>
        :root {
            --primary-green: #02451A;
            --bg-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(2, 69, 26, 0.1);
            --card-shadow: 0 8px 32px -8px rgba(2, 69, 26, 0.1);
            --text-main: #02451A;
            --text-muted: rgba(2, 69, 26, 0.6);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100svh; overflow: hidden; position: relative;
        }

        .ambient-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(2, 69, 26, 0.05), transparent 50%),
                        radial-gradient(circle at 85% 30%, rgba(2, 69, 26, 0.08), transparent 50%);
        }

        .app-container {
            width: 100%; max-width: 480px; height: 100vh; height: 100svh; display: flex; flex-direction: column; position: relative;
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 0 50px rgba(0,0,0,0.05); overflow: hidden;
        }

        /* Header */
        .header {
            padding: 24px 24px 15px 24px; display: flex; align-items: center; justify-content: space-between; z-index: 10;
        }

        .back-btn {
            background: var(--glass-bg); border: 1px solid var(--glass-border); width: 42px; height: 42px; border-radius: 14px;
            display: flex; justify-content: center; align-items: center; color: var(--primary-green); cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 69, 26, 0.05); transition: all 0.3s ease;
        }

        .back-btn:hover { background: white; transform: translateX(-3px); box-shadow: 0 6px 15px rgba(2, 69, 26, 0.1); }
        .header-title { font-size: 20px; font-weight: 800; color: var(--primary-green); }

        /* Content Area */
        .history-content {
            flex-grow: 1; padding: 10px 24px 40px 24px; overflow-y: auto; scrollbar-width: none;
            display: flex; flex-direction: column; gap: 20px;
        }
        .history-content::-webkit-scrollbar { display: none; }

        /* Filter Chips */
        .filter-row {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none;
            margin-top: 5px; margin-bottom: 5px; animation: slideIn 0.5s ease backwards;
        }
        .filter-row::-webkit-scrollbar { display: none; }
        
        .filter-chip {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 8px 16px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer;
            white-space: nowrap; transition: all 0.2s ease; font-family: inherit;
        }
        .filter-chip.active {
            background: var(--primary-green); color: white; border-color: transparent; box-shadow: 0 4px 12px rgba(2, 69, 26, 0.2);
        }

        /* Activity List */
        .date-divider {
            font-size: 13px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;
            margin-top: 15px; margin-bottom: 0px; animation: slideIn 0.5s ease 0.1s backwards;
        }
        
        .activity-list { display: flex; flex-direction: column; gap: 12px; animation: slideIn 0.5s ease 0.2s backwards; }
        
        .activity-item {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 15px;
            display: flex; align-items: center; gap: 15px; box-shadow: var(--card-shadow); transition: transform 0.2s;
        }
        .activity-item:hover { transform: translateY(-2px); }
        
        .act-icon {
            width: 42px; height: 42px; border-radius: 12px; display: flex; justify-content: center; align-items: center; flex-shrink: 0;
        }
        .act-icon.quiz { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .act-icon.mission { background: rgba(2, 69, 26, 0.1); color: var(--primary-green); }
        .act-icon.manual { background: rgba(234, 179, 8, 0.1); color: #eab308; }
        
        .act-details { flex-grow: 1; }
        .act-title { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
        .act-time { font-size: 11px; font-weight: 600; color: var(--text-muted); }
        
        .act-points {
            font-size: 14px; font-weight: 800; color: var(--primary-green); background: rgba(2, 69, 26, 0.05); padding: 4px 8px; border-radius: 8px;
        }

        .activity-meta {
            display: none; margin-top: 10px; font-size: 12px; color: var(--text-muted); line-height: 1.5;
            border-top: 1px solid rgba(2, 69, 26, 0.08); padding-top: 10px;
        }
        .activity-item.expanded .activity-meta {
            display: block;
        }
        .activity-item.expanded { background: rgba(2, 69, 26, 0.03); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>

<body>
    <div class="ambient-layer"></div>

    <div class="app-container">
        
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="back-btn" onclick="window.location.href='stat.html'">
                    <i data-lucide="chevron-left"></i>
                </button>
            </div>
            <div class="header-title">Task History</div>
            <div style="width: 42px;"></div> <!-- Spacer -->
        </header>

        <main class="history-content">
            
            <div class="filter-row">
                <button class="filter-chip active" data-filter="all">All Tasks</button>
                <button class="filter-chip" data-filter="mission">Missions</button>
                <button class="filter-chip" data-filter="manual">Manual</button>
                <button class="filter-chip" data-filter="quiz">Quizzes</button>
            </div>

            <div id="taskHistoryContainer">
                <div class="date-divider">Recent Tasks</div>
                <div id="taskHistoryList" class="activity-list">
                    <div class="activity-item">
                        <div class="act-icon manual"><i data-lucide="loader"></i></div>
                        <div class="act-details">
                            <div class="act-title">Loading task history...</div>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        lucide.createIcons();

        async function initTaskHistory() {
            const $chips = document.querySelectorAll('.filter-chip');
            let currentFilter = 'all';

            $chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    currentFilter = chip.dataset.filter || 'all';
                    renderTaskHistory(filteredTasks(currentFilter));
                });
            });

            try {
                if (!window.supabaseClient) {
                    console.error("EcoTrack Error: 'window.supabaseClient' not found. Ensure supabase_config.js is loaded above this script.");
                    return;
                }

                const { data: { session }, error: sessionError } = await window.supabaseClient.auth.getSession();
                if (sessionError || !session?.user?.id) {
                    console.error('Unable to determine logged in user for task history', sessionError);
                    return;
                }

                const userId = session.user.id;
                const { data: history, error } = await window.supabaseClient
                    .from('user_projects')
                    .select('id, project_id, type, points, submission_date, approved_by, status, description')
                    .eq('user_id', userId)
                    .in('status', ['completed', 'approved'])
                    .order('submission_date', { ascending: false });

                if (error) {
                    console.error('Failed to fetch task history:', error);
                    return;
                }

                const tasks = history || [];
                const projectIds = Array.from(new Set(tasks.filter(task => task.project_id).map(task => task.project_id)));
                const projectMap = {};

                if (projectIds.length > 0) {
                    const { data: projects, error: projectError } = await window.supabaseClient
                        .from('projects')
                        .select('id, title')
                        .in('id', projectIds);

                    if (!projectError && projects) {
                        projects.forEach(project => {
                            projectMap[project.id] = project;
                        });
                    } else {
                        console.warn('Unable to fetch project metadata for task history:', projectError);
                    }
                }

                const approvedByIds = Array.from(new Set(tasks.filter(task => task.approved_by).map(task => task.approved_by)));
                const collectorMap = {};

                if (approvedByIds.length > 0) {
                    const { data: collectors, error: collectorError } = await window.supabaseClient
                        .from('profiles')
                        .select('*')
                        .in('id', approvedByIds);

                    if (!collectorError && collectors) {
                        collectors.forEach(profile => {
                            collectorMap[profile.id] = profile;
                        });
                    } else {
                        console.warn('Unable to fetch collector profiles for task history:', collectorError);
                    }
                }

                window.__taskHistoryItems = tasks.map(task => ({
                    ...task,
                    project: projectMap[task.project_id] || null,
                    title: deriveTaskTitle({ ...task, project: projectMap[task.project_id] || null }),
                    collector: formatCollector(collectorMap[task.approved_by]),
                    submittedAt: formatSubmissionDate(task.submission_date),
                    displayType: (projectMap[task.project_id]?.title ? 'mission' : task.type || 'manual').toLowerCase()
                }));

                renderTaskHistory(window.__taskHistoryItems);
            } catch (err) {
                console.error('Task history init failed:', err);
            }
        }

        function deriveTaskTitle(task) {
            if (task.project && task.project.title) return task.project.title;
            if (task.description) {
                const cleaned = String(task.description).replace(/kg/gi, '').trim();
                const parts = cleaned.split(/[-,:]/);
                if (parts.length > 0 && parts[0].trim()) {
                    return parts[0].trim();
                }
                return cleaned;
            }
            return 'Manual Submission';
        }

        function formatCollector(profile) {
            if (!profile) return 'Unknown collector';
            const keys = ['full_name', 'fullName', 'name', 'display_name', 'displayName', 'first_name', 'firstname', 'last_name', 'lastname'];
            for (const key of keys) {
                if (profile[key]) return String(profile[key]);
            }
            if (profile.role) return `Collector (${profile.role})`;
            return `Collector ${profile.id?.slice(0, 8) || ''}`.trim();
        }

        function formatSubmissionDate(value) {
            if (!value) return 'Unknown date';
            const date = new Date(value);
            if (isNaN(date.getTime())) return String(value);
            return date.toLocaleString([], { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
        }

        function filteredTasks(filter) {
            const allTasks = window.__taskHistoryItems || [];
            if (filter === 'all') return allTasks;
            return allTasks.filter(task => task.displayType === filter);
        }

        function renderTaskHistory(tasks) {
            const list = document.getElementById('taskHistoryList');
            if (!list) return;

            if (!tasks || tasks.length === 0) {
                list.innerHTML = '<div class="activity-item"><div class="act-details"><div class="act-title">No tasks found.</div></div></div>';
                lucide.createIcons();
                return;
            }

            list.innerHTML = tasks.map(task => {
                const iconType = task.displayType === 'quiz' ? 'brain' : task.displayType === 'mission' ? 'target' : 'hand';
                const iconClass = task.displayType === 'quiz' ? 'quiz' : task.displayType === 'mission' ? 'mission' : 'manual';
                return `
                    <div class="activity-item" data-task-id="${task.id}">
                        <div class="act-icon ${iconClass}"><i data-lucide="${iconType}"></i></div>
                        <div class="act-details">
                            <div class="act-title">${escapeHtml(task.title)}</div>
                            <div class="act-time">${task.submittedAt}</div>
                            <div class="activity-meta">
                                <div><strong>Collector:</strong> ${escapeHtml(task.collector)}</div>
                                <div><strong>Status:</strong> ${escapeHtml(task.status || 'unknown')}</div>
                            </div>
                        </div>
                        <div class="act-points">+${Number(task.points || 0)}</div>
                    </div>
                `;
            }).join('');

            list.querySelectorAll('.activity-item').forEach(item => {
                item.addEventListener('click', () => {
                    item.classList.toggle('expanded');
                });
            });

            lucide.createIcons();
        }

        function escapeHtml(text) {
            return String(text || '').replace(/[&<>"]+/g, match => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
            })[match]);
        }

        document.addEventListener('DOMContentLoaded', initTaskHistory);
    </script>
</body>

</html>

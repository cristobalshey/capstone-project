<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EcoTrack | Quizzes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase_config.js"></script>
    <script src="../auth_guard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-green: #02451A;
            --bg-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(2, 69, 26, 0.1);
            --card-shadow: 0 8px 32px -8px rgba(2, 69, 26, 0.1);
            --text-main: #02451A;
            --text-muted: rgba(2, 69, 26, 0.6);
        }

        /* ... Reset & Body ... */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-color); color: var(--text-main);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden;
            position: relative;
        }
        .ambient-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(2, 69, 26, 0.05), transparent 50%), radial-gradient(circle at 85% 30%, rgba(2, 69, 26, 0.08), transparent 50%);
        }
        .app-container {
            width: 100%; max-width: 480px; height: 100vh; display: flex; flex-direction: column; position: relative;
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px); box-shadow: 0 0 50px rgba(0,0,0,0.05); overflow: hidden;
        }

        /* Header */
        .header { padding: 24px 24px 15px 24px; display: flex; align-items: center; justify-content: space-between; z-index: 10; }
        .back-btn {
            background: var(--glass-bg); border: 1px solid var(--glass-border); width: 42px; height: 42px;
            border-radius: 14px; display: flex; justify-content: center; align-items: center; color: var(--primary-green);
            cursor: pointer; box-shadow: 0 4px 12px rgba(2, 69, 26, 0.05); transition: all 0.3s ease;
        }
        .back-btn:hover { background: white; transform: translateX(-3px); box-shadow: 0 6px 15px rgba(2, 69, 26, 0.1); }
        .header-title { font-size: 20px; font-weight: 800; color: var(--primary-green); text-transform: uppercase; }
        .points-display {
            background: var(--primary-green); color: white; padding: 8px 14px; border-radius: 14px; font-size: 13px; font-weight: 800;
            display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(2, 69, 26, 0.2);
        }

        .content-area { flex-grow: 1; padding: 10px 24px 40px 24px; overflow-y: auto; scrollbar-width: none; }
        .content-area::-webkit-scrollbar { display: none; }

        .status-filters { display: flex; background: rgba(2, 69, 26, 0.05); padding: 4px; border-radius: 12px; margin-bottom: 20px; }
        .filter-btn { flex: 1; padding: 10px 0; border-radius: 10px; border: none; background: transparent; color: var(--text-muted); font-weight: 800; text-transform: uppercase; cursor: pointer; transition: all 0.2s ease; }
        .filter-btn.active { background: white; color: var(--primary-green); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        /* Instruction Banner */
        .instruction-banner {
            background: rgba(255, 255, 255, 0.9);
            border: 1px dashed rgba(2, 69, 26, 0.3);
            border-radius: 16px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(2, 69, 26, 0.05);
        }

        .instruction-text {
            font-size: 12px;
            font-weight: 800;
            color: var(--primary-green);
            text-transform: uppercase;
            line-height: 1.4;
            max-width: 100%;
        }

        .quiz-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px;
            box-shadow: var(--card-shadow); margin-bottom: 15px; animation: slideIn 0.5s ease backwards;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .quiz-title { font-size: 16px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; }
        .quiz-detail { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
        .quiz-detail span { color: var(--text-main); }
        .quiz-actions { display: flex; justify-content: flex-end; margin-top: 15px; border-top: 1px dashed rgba(2, 69, 26, 0.1); padding-top: 15px; }

        .start-btn { background: var(--primary-green); color: white; border: none; padding: 10px 24px; border-radius: 12px; font-family: inherit; font-weight: 800; font-size: 13px; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(2, 69, 26, 0.2); transition: all 0.2s; }
        .start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(2, 69, 26, 0.3); }
        .start-btn.review { background: rgba(2, 69, 26, 0.1); color: var(--primary-green); flex-grow: 1; justify-content: center; box-shadow: none; }
        .start-btn.review:hover { background: rgba(2, 69, 26, 0.2); transform: none; }
        
        /* Review Screen inside quizzes.html */
        #reviewSection {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 50;
            flex-direction: column;
            overflow-y: auto;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .review-header {
            padding: 24px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--glass-border);
            position: sticky; top: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); z-index: 10;
        }

        .review-content { padding: 24px; padding-bottom: 100px; }
        .review-score { font-size: 32px; font-weight: 800; text-align: center; color: var(--primary-green); margin-bottom: 20px; text-transform: uppercase; }

        .qa-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(2, 69, 26, 0.05);
        }
        .q-text { font-size: 14px; font-weight: 800; margin-bottom: 15px; color: var(--text-main); line-height: 1.4; }
        
        .answer-row { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; font-weight: 700; padding: 12px; border-radius: 10px; margin-bottom: 8px; transition: all 0.2s; }
        .answer-row.correct { background: rgba(0, 230, 118, 0.1); color: #008844; border: 1px solid rgba(0, 230, 118, 0.3); }
        .answer-row.wrong { background: rgba(255, 59, 48, 0.1); color: #CC2211; border: 1px solid rgba(255, 59, 48, 0.3); }
        .answer-row:not(.correct):not(.wrong) { background: rgba(2, 69, 26, 0.03); color: var(--text-muted); border: 1px solid transparent; }

        .badge-container { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; margin-left: 10px; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; white-space: nowrap; }
        .badge.your-answer { background: var(--primary-green); color: white; }
        .badge.correct-answer { background: #00E676; color: var(--primary-green); }

    </style>
</head>
<body>

    <div class="ambient-layer"></div>

    <div class="app-container">
        <!-- Main Quizzes View -->
        <!-- Main Quizzes View -->
        <div id="mainView" style="display: flex; flex-direction: column; width: 100%; height: 100%;">
            <header class="header">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <button class="back-btn" onclick="window.location.href='menu.html'">
                        <i data-lucide="chevron-left"></i>
                    </button>
                    <div class="header-title">Quizzes</div>
                </div>
            </header>

            <div class="content-area">
                <div class="status-filters">
                    <button class="filter-btn active" onclick="filterQuizzes('all')">All</button>
                    <button class="filter-btn" onclick="filterQuizzes('available')">Available</button>
                    <button class="filter-btn" onclick="filterQuizzes('completed')">Completed</button>
                </div>

                <div class="instruction-banner">
                    <div class="instruction-text">Take quizzes to earn points and rewards</div>
                </div>

                <div id="quizList">
                    <div style="text-align: center; padding: 40px; color: var(--text-muted);" id="loadingHint">
                        <i data-lucide="loader" style="width: 32px; height: 32px; animation: spin 2s linear infinite;"></i>
                        <p style="margin-top: 10px; font-weight: 700;">FETCHING QUIZZES...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- QUIZ PLAYER SECTION -->
        <div id="playerSection" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 60; flex-direction: column;">
            <div class="review-header">
                <button class="back-btn" onclick="abortQuiz()">
                    <i data-lucide="x"></i>
                </button>
                <div class="header-title" id="playerQuizTitle" style="font-size: 14px;">---</div>
            </div>
            <div class="content-area" style="padding-top: 30px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 800; font-size: 12px; color: var(--text-muted);">
                    <span id="progressText">Question 1/10</span>
                </div>
                <div style="height: 6px; background: rgba(2, 69, 26, 0.05); border-radius: 10px; margin-bottom: 30px; overflow: hidden;">
                    <div id="progressBar" style="height: 100%; background: var(--primary-green); width: 0%; transition: 0.3s;"></div>
                </div>
                
                <div id="questionContainer">
                    <div class="q-text" id="activeQText" style="font-size: 18px; margin-bottom: 25px;">Loading Question...</div>
                    <div id="optionsList" style="display: flex; flex-direction: column; gap: 12px;">
                        <!-- Options injected here -->
                    </div>
                </div>
            </div>
            <div style="padding: 24px;">
                <button class="btn-primary" id="nextBtn" onclick="handleNext()" disabled style="background: var(--primary-green); color: white; border: none; padding: 16px; border-radius: 16px; width: 100%; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px;">
                    Next <i data-lucide="chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- REVIEW SECTION -->
        <div id="reviewSection">
            <div class="review-header">
                <button class="back-btn" onclick="closeReview()">
                    <i data-lucide="chevron-left"></i>
                </button>
                <div class="header-title" id="reviewQuizTitle" style="font-size: 14px;">Review</div>
            </div>

            <div class="review-content" id="reviewContent">
                <!-- Review results here -->
            </div>
        </div>
    </div>

    <style>
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .option-card {
            background: white; border: 1.5px solid var(--glass-border); border-radius: 16px; padding: 18px;
            display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s;
        }
        .option-card:hover { border-color: var(--primary-green); background: rgba(2, 69, 26, 0.02); }
        .option-card.selected { background: var(--primary-green); color: white; border-color: var(--primary-green); transform: scale(1.02); }
        .option-letter { font-weight: 800; width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(2, 69, 26, 0.05); color: var(--primary-green); font-size: 12px; }
        .option-card.selected .option-letter { background: white; color: var(--primary-green); }
        .btn-primary { box-shadow: 0 8px 20px rgba(2, 69, 26, 0.2); cursor: pointer; transition: 0.3s; }
        .btn-primary:disabled { background: #ccc !important; cursor: not-allowed; }
    </style>

    <script>
        lucide.createIcons();

        let quizzes = [];
        let userActivities = [];
        let activeQuiz = null;
        let currentQIndex = 0;
        let userAnswers = [];

        document.addEventListener('DOMContentLoaded', initQuizzes);

        async function initQuizzes() {
            const { data: { user } } = await window.supabaseClient.auth.getUser();
            if (!user) return;

            try {
                // 1. Fetch user's quiz history
                const { data: aData, error: aError } = await window.supabaseClient
                    .from('user_projects')
                    .select('project_id, status, score, submission_data')
                    .eq('user_id', user.id);

                if (aError) throw aError;
                userActivities = aData || [];

                const participantProjectIds = userActivities
                    .map(a => a.project_id)
                    .filter(id => id !== null);

                // 2. Fetch quizzes: active OR already participated in
                const now = new Date().toISOString().split('T')[0];
                
                let query = window.supabaseClient
                    .from('projects')
                    .select('*')
                    .eq('type', 'Quiz');

                if (participantProjectIds.length > 0) {
                    const idList = `(${participantProjectIds.join(',')})`;
                    query = query.or(`end_date.gte.${now},id.in.${idList}`);
                } else {
                    query = query.gte('end_date', now);
                }

                const { data: pData, error: pError } = await query
                    .order('created_at', { ascending: false });

                if (pError) throw pError;
                quizzes = pData || [];

                renderQuizzes();
            } catch (err) {
                console.error(err);
                document.getElementById('loadingHint').innerHTML = `<p style="color:red">Failed to load quizzes.</p>`;
            }
        }

        function renderQuizzes(filter = 'all') {
            const container = document.getElementById('quizList');
            container.innerHTML = '';

            const filtered = quizzes.filter(q => {
                const activity = userActivities.find(a => a.project_id === q.id);
                const dbStatus = activity ? activity.status : 'available';
                
                if (filter === 'all') return true;
                if (filter === 'completed') return (dbStatus === 'completed' || dbStatus === 'approved');
                return dbStatus === filter;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:50px; color:var(--text-muted); font-weight:700;">NO QUIZZES FOUND</div>`;
                return;
            }

            filtered.forEach(q => {
                const activity = userActivities.find(a => a.project_id === q.id);
                const dbStatus = activity ? activity.status : 'available';

                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.dataset.status = (dbStatus === 'approved' || dbStatus === 'completed') ? 'completed' : dbStatus;

                let actionHtml = '';
                if (dbStatus === 'completed' || dbStatus === 'approved') {
                    actionHtml = `
                        <div class="quiz-detail">
                            <i data-lucide="check-circle" style="width: 14px; height: 14px; color: var(--primary-green);"></i> SCORE: <span style="color: var(--primary-green);">${activity.score}/${q.questions?.length || 0}</span>
                        </div>
                        <div class="quiz-actions">
                            <button class="start-btn review" onclick="openReview('${q.id}')">REVIEW <i data-lucide="eye" style="width:16px;"></i></button>
                        </div>
                    `;
                    card.style.opacity = '0.85';
                } else if (dbStatus === 'pending') {
                    actionHtml = `
                        <div class="quiz-actions">
                            <button class="start-btn" style="background: #eab308; color: white; border: none;" disabled>PENDING <i data-lucide="clock" style="width:16px;"></i></button>
                        </div>
                    `;
                } else {
                    actionHtml = `
                        <div class="quiz-actions">
                            <button class="start-btn" onclick="startQuiz('${q.id}')">START <i data-lucide="play" style="width:16px;"></i></button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="quiz-title">${q.title}</div>
                    <div class="quiz-detail">
                        <i data-lucide="help-circle" style="width: 14px; height: 14px;"></i> QUESTIONS: <span>${q.questions?.length || 0} Items</span>
                    </div>
                    ${actionHtml}
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function filterQuizzes(status) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderQuizzes(status);
        }

        function startQuiz(id) {
            activeQuiz = quizzes.find(q => q.id === id);
            if (!activeQuiz || !activeQuiz.questions) return;

            currentQIndex = 0;
            userAnswers = [];
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('playerSection').style.display = 'flex';
            document.getElementById('playerQuizTitle').textContent = activeQuiz.title;
            
            showQuestion();
        }

        function showQuestion() {
            const q = activeQuiz.questions[currentQIndex];
            document.getElementById('progressText').textContent = `Question ${currentQIndex + 1}/${activeQuiz.questions.length}`;
            document.getElementById('progressBar').style.width = `${((currentQIndex + 1) / activeQuiz.questions.length) * 100}%`;
            document.getElementById('activeQText').textContent = q.q;
            
            const list = document.getElementById('optionsList');
            list.innerHTML = '';
            
            ['a', 'b', 'c', 'd'].forEach(letter => {
                const opt = document.createElement('div');
                opt.className = 'option-card';
                opt.onclick = () => selectOption(letter, opt);
                opt.innerHTML = `<div class="option-letter">${letter.toUpperCase()}</div><span>${q[letter]}</span>`;
                list.appendChild(opt);
            });

            document.getElementById('nextBtn').disabled = true;
            document.getElementById('nextBtn').innerHTML = (currentQIndex === activeQuiz.questions.length - 1) ? 'Submit Quiz <i data-lucide="check"></i>' : 'Next Question <i data-lucide="chevron-right"></i>';
            lucide.createIcons();
        }

        function selectOption(letter, el) {
            document.querySelectorAll('.option-card').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            userAnswers[currentQIndex] = letter.toUpperCase();
            document.getElementById('nextBtn').disabled = false;
        }

        async function handleNext() {
            if (currentQIndex < activeQuiz.questions.length - 1) {
                currentQIndex++;
                showQuestion();
            } else {
                await submitQuiz();
            }
        }

        async function submitQuiz() {
            const score = userAnswers.reduce((acc, ans, idx) => {
                return acc + (ans === activeQuiz.questions[idx].correct ? 1 : 0);
            }, 0);

            const totalQuizPoints = activeQuiz.points || 0;
            const totalQuestionsCount = activeQuiz.questions.length || 1;
            const pointsEarned = Math.round(score * (totalQuizPoints / totalQuestionsCount));

            const { data: { user } } = await window.supabaseClient.auth.getUser();
            const { error } = await window.supabaseClient
                .from('user_projects')
                .insert([{
                    user_id: user.id,
                    project_id: activeQuiz.id,
                    status: 'approved', // Auto-approved for quizzes
                    score: score,
                    points: pointsEarned,
                    submission_data: { answers: userAnswers }
                }]);

            if (error) {
                console.error('Quiz Submission Error:', error);
                Swal.fire('Error', 'Submission failed: ' + error.message, 'error');
            } else {
                Swal.fire({
                    icon: 'success',
                    title: 'Quiz Finished!',
                    text: `You scored ${score}/${activeQuiz.questions.length} and earned ${pointsEarned} points!`,
                    confirmButtonColor: 'var(--primary-green)'
                }).then(() => {
                    location.reload();
                });
            }
        }

        function abortQuiz() {
            Swal.fire({
                title: 'Abort Quiz?',
                text: 'Your progress will be lost.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: 'var(--primary-green)'
            }).then(res => {
                if (res.isConfirmed) location.reload();
            });
        }

        function openReview(id) {
            const q = quizzes.find(item => item.id === id);
            const activity = userActivities.find(a => a.project_id === id);
            if (!q || !activity) return;

            document.getElementById('reviewQuizTitle').textContent = q.title;
            const content = document.getElementById('reviewContent');
            const total = q.questions.length;
            const score = activity.score;
            
            content.innerHTML = `<div class="review-score">Score: ${score}/${total}</div>`;
            
            q.questions.forEach((item, idx) => {
                const userAns = activity.submission_data?.answers?.[idx] || 'N/A';
                const isCorrect = userAns === item.correct;
                
                const card = document.createElement('div');
                card.className = 'qa-card';
                card.innerHTML = `
                    <div class="q-text">${idx + 1}. ${item.q}</div>
                    ${['A', 'B', 'C', 'D'].map(l => {
                        let cls = '';
                        let badge = '';
                        if (l === item.correct) cls = 'correct';
                        if (l === userAns && !isCorrect) cls = 'wrong';
                        
                        if (l === userAns) badge += '<span class="badge your-answer">Your Answer</span>';
                        if (l === item.correct) badge += '<span class="badge correct-answer">Correct</span>';

                        return `
                            <div class="answer-row ${cls}">
                                <i data-lucide="${cls === 'correct' ? 'check-circle' : (cls === 'wrong' ? 'x-circle' : 'circle')}" style="width:16px;"></i>
                                <span style="flex:1">${item[l.toLowerCase()]}</span>
                                <div class="badge-container">${badge}</div>
                            </div>
                        `;
                    }).join('')}
                `;
                content.appendChild(card);
            });

            document.getElementById('reviewSection').style.display = 'flex';
            lucide.createIcons();
        }

        function closeReview() {
            document.getElementById('reviewSection').style.display = 'none';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EcoTrack | Redeem Points</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase_config.js"></script>
    <script src="auth_guard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-green: #02451A;
            --bg-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(2, 69, 26, 0.1);
            --card-shadow: 0 8px 32px -8px rgba(2, 69, 26, 0.1);
            --text-main: #02451A;
            --text-muted: rgba(2, 69, 26, 0.6);
            --gcash-blue: #004d9c;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100svh; overflow: hidden; position: relative;
        }

        .ambient-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(2, 69, 26, 0.05), transparent 50%),
                        radial-gradient(circle at 85% 30%, rgba(0, 77, 156, 0.05), transparent 50%);
        }

        .app-container {
            width: 100%; max-width: 480px; height: 100vh; height: 100svh; display: flex; flex-direction: column; position: relative;
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 0 50px rgba(0,0,0,0.05); overflow: hidden;
        }

        /* Header */
        .header {
            padding: 24px 24px 15px 24px; display: flex; align-items: center; justify-content: space-between; z-index: 10;
        }

        .back-btn {
            background: var(--glass-bg); border: 1px solid var(--glass-border); width: 42px; height: 42px; border-radius: 14px;
            display: flex; justify-content: center; align-items: center; color: var(--primary-green); cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 69, 26, 0.05); transition: all 0.3s ease;
        }

        .back-btn:hover { background: white; transform: translateX(-3px); box-shadow: 0 6px 15px rgba(2, 69, 26, 0.1); }
        .header-title { font-size: 20px; font-weight: 800; color: var(--primary-green); }

        /* Multi-View System */
        .view-content {
            flex-grow: 1; padding: 10px 24px 40px 24px; overflow-y: auto; scrollbar-width: none;
            display: none; flex-direction: column; gap: 20px;
            opacity: 0; transform: translateX(20px); transition: all 0.3s ease;
        }
        .view-content.active { display: flex; opacity: 1; transform: translateX(0); }
        .view-content::-webkit-scrollbar { display: none; }

        /* Points Balance Card */
        .balance-card {
            background: var(--primary-green); border-radius: 24px; padding: 30px;
            color: white; display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 15px 35px -5px rgba(2, 69, 26, 0.3); position: relative; overflow: hidden;
            animation: slideIn 0.5s ease backwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .balance-card::before {
            content: ''; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px;
            background: rgba(255,255,255,0.1); border-radius: 50%;
        }

        .balance-label { font-size: 14px; font-weight: 600; opacity: 0.9; margin-bottom: 5px; }
        .balance-value { font-size: 42px; font-weight: 800; display: flex; align-items: center; gap: 10px; line-height: 1; }
        .balance-value i { width: 32px; height: 32px; fill: rgba(255,255,255,0.2); }

        /* Form Card */
        .form-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 24px; padding: 25px;
            box-shadow: var(--card-shadow); backdrop-filter: blur(12px); display: flex; flex-direction: column; gap: 20px;
            animation: slideIn 0.5s ease 0.1s backwards;
        }
        
        .form-header {
            display: flex; align-items: center; gap: 12px; margin-bottom: 5px; color: var(--gcash-blue);
        }
        
        .form-header i { width: 24px; height: 24px; }
        .form-header span { font-size: 18px; font-weight: 800; }

        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-label { font-size: 13px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
        .form-control {
            width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid rgba(2, 69, 26, 0.2);
            background: rgba(255, 255, 255, 0.9); color: var(--text-main); font-family: inherit; font-size: 15px; font-weight: 600; outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .form-control:focus { border-color: var(--primary-green); box-shadow: 0 0 0 3px rgba(2, 69, 26, 0.1); }
        .form-control::placeholder { color: rgba(2, 69, 26, 0.4); }

        /* Notice Box */
        .info-box {
            background: rgba(2, 69, 26, 0.05); border: 1px solid rgba(2, 69, 26, 0.15); border-radius: 16px; padding: 15px;
            display: flex; gap: 12px; color: var(--primary-green); animation: slideIn 0.5s ease 0.2s backwards;
        }
        
        .info-box i { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; }
        .info-text { font-size: 13px; font-weight: 600; line-height: 1.5; }

        .btn-primary {
            border: none; padding: 16px; border-radius: 16px; font-family: inherit; font-size: 16px; font-weight: 800;
            background: var(--primary-green); color: white; box-shadow: 0 8px 20px rgba(2, 69, 26, 0.25); cursor: pointer; transition: all 0.3s ease;
            display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; margin-top: auto;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(2, 69, 26, 0.35); }

        /* Passcode UI */
        .passcode-display-wrap {
            display: flex; justify-content: center; align-items: center; gap: 15px; margin: 30px 0 50px 0;
        }
        .passcode-dot {
            width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(2, 69, 26, 0.3); transition: all 0.2s;
        }
        .passcode-dot.filled { background: var(--primary-green); border-color: var(--primary-green); transform: scale(1.1); box-shadow: 0 4px 10px rgba(2, 69, 26, 0.2); }
        
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0 20px; max-width: 320px; margin: 0 auto; }
        .keypad-btn {
            background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(2, 69, 26, 0.1);
            width: 70px; height: 70px; border-radius: 50%; font-family: inherit; font-size: 28px; font-weight: 700; color: var(--text-main);
            display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 12px rgba(2, 69, 26, 0.05); margin: 0 auto; transition: all 0.1s;
        }
        .keypad-btn:active { transform: scale(0.9); background: rgba(2, 69, 26, 0.1); }
        .keypad-btn.action { font-size: 16px; background: transparent; box-shadow: none; border: none; }
        
        #passcodeText { text-align: center; font-size: 18px; font-weight: 800; color: var(--primary-green); margin-top: 10px; }
        .passcode-sub { text-align: center; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-top: 5px; }

    </style>
</head>

<body>
    <div class="ambient-layer"></div>

    <div class="app-container">
        
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="back-btn" onclick="handleBack()">
                    <i data-lucide="chevron-left"></i>
                </button>
                <div class="header-title" id="headerTitle">Withdraw to GCash</div>
            </div>
            <div style="width: 42px;"></div> <!-- Spacer -->
        </header>

        <!-- VIEW: Form -->
        <main class="view-content active" id="viewForm">
            
            <div class="balance-card">
                <span class="balance-label">Available Points</span>
                <div class="balance-value">
                    <i data-lucide="coins"></i> <span id="currentPoints">150</span>
                </div>
            </div>

            <div class="form-card">
                <div class="form-header">
                    <i data-lucide="wallet"></i>
                    <span>GCash Details</span>
                </div>

                <div class="form-group">
                    <label class="form-label">Account Name</label>
                    <input type="text" class="form-control" placeholder="Juan Dela Cruz" id="accName">
                </div>

                <div class="form-group">
                    <label class="form-label">GCash Mobile Number</label>
                    <input type="tel" class="form-control" placeholder="09XX XXX XXXX" id="accNum">
                </div>

                <div class="form-group" style="margin-top: 5px;">
                    <label class="form-label" style="display: flex; justify-content: space-between;">
                        <span>Points to Redeem</span>
                        <span style="color: var(--primary-green);">10 pts = ₱1</span>
                    </label>
                    <input type="number" class="form-control" placeholder="Minimum 50 points" id="pointsVal">
                </div>
            </div>

            <div class="info-box">
                <i data-lucide="info"></i>
                <div class="info-text">
                    All withdrawal requests are strictly reviewed by the administration before being disbursed. Please allow up to 48 hours for processing.
                </div>
            </div>

            <button class="btn-primary" onclick="processWithdraw()">
                Continue to Verification
            </button>
        </main>

        <!-- VIEW: PIN Verification -->
        <main class="view-content" id="viewPin">
            <div id="passcodeText">GCash Transaction PIN</div>
            <div class="passcode-sub">Enter your 6-digit PIN to authorize this GCash transaction</div>
            
            <div class="passcode-display-wrap">
                <div class="passcode-dot"></div>
                <div class="passcode-dot"></div>
                <div class="passcode-dot"></div>
                <div class="passcode-dot"></div>
                <div class="passcode-dot"></div>
                <div class="passcode-dot"></div>
            </div>

            <div class="keypad">
                <button class="keypad-btn" onclick="addPin(1)">1</button>
                <button class="keypad-btn" onclick="addPin(2)">2</button>
                <button class="keypad-btn" onclick="addPin(3)">3</button>
                <button class="keypad-btn" onclick="addPin(4)">4</button>
                <button class="keypad-btn" onclick="addPin(5)">5</button>
                <button class="keypad-btn" onclick="addPin(6)">6</button>
                <button class="keypad-btn" onclick="addPin(7)">7</button>
                <button class="keypad-btn" onclick="addPin(8)">8</button>
                <button class="keypad-btn" onclick="addPin(9)">9</button>
                <button class="keypad-btn action"></button>
                <button class="keypad-btn" onclick="addPin(0)">0</button>
                <button class="keypad-btn action" onclick="removePin()"><i data-lucide="delete"></i></button>
            </div>
        </main>

    </div>

    <script>
        lucide.createIcons();

        let currentView = 'viewForm';
        let currentPin = '';

        function handleBack() {
            if (currentView === 'viewForm') {
                window.location.href = 'menu.html';
            } else {
                // Return to form if backing out of PIN lock
                switchView('viewForm', 'Withdraw to GCash');
                currentPin = '';
                updateDots();
            }
        }

        function switchView(viewId, title) {
            document.querySelectorAll('.view-content').forEach(el => {
                el.classList.remove('active');
                setTimeout(() => { if(!el.classList.contains('active')) el.style.display = 'none'; }, 300);
            });
            
            const target = document.getElementById(viewId);
            target.style.display = 'flex';
            setTimeout(() => target.classList.add('active'), 50);
            
            document.getElementById('headerTitle').textContent = title;
            currentView = viewId;
        }

        function processWithdraw() {
            const accName = document.getElementById('accName').value.trim();
            const accNum = document.getElementById('accNum').value.trim();
            const pointsVal = document.getElementById('pointsVal').value.trim();
            const currentPoints = parseInt(document.getElementById('currentPoints').innerText) || 0;
            
            if(!accName || !accNum || !pointsVal) {
                Swal.fire({
                    icon: 'info',
                    title: 'Incomplete Details',
                    text: 'Please complete the GCash details first.',
                    confirmButtonColor: '#02451A'
                });
                return;
            }

            const redeemAmount = parseInt(pointsVal);
            if (isNaN(redeemAmount) || redeemAmount < 50) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Minimum Redemption',
                    text: 'Minimum redemption is 50 points.',
                    confirmButtonColor: '#02451A'
                });
                return;
            }

            if (redeemAmount > currentPoints) {
                Swal.fire({
                    icon: 'error',
                    title: 'Insufficient Points',
                    text: 'You only have ' + currentPoints + ' points available.',
                    confirmButtonColor: '#02451A'
                });
                return;
            }
            
            // Slide to PIN View to confirm
            switchView('viewPin', 'Verify Action');
        }

        // Passcode Logic
        function updateDots() {
            const dots = document.querySelectorAll('.passcode-dot');
            dots.forEach((dot, index) => {
                if (index < currentPin.length) dot.classList.add('filled');
                else dot.classList.remove('filled');
            });

            if (currentPin.length === 6) {
                // Simulated validation success
                setTimeout(() => {
                    Swal.fire({
                        icon: 'success',
                        title: 'Request Submitted!',
                        text: 'Your GCash withdrawal request is now under review by the admin.',
                        confirmButtonColor: '#02451A'
                    }).then(() => {
                        window.location.href = 'menu.html';
                    });
                }, 300);
            }
        }

        function addPin(num) {
            if (currentPin.length < 6) {
                currentPin += num.toString();
                updateDots();
            }
        }

        function removePin() {
            if (currentPin.length > 0) {
                currentPin = currentPin.slice(0, -1);
                updateDots();
            }
        }
    </script>
</body>

</html>

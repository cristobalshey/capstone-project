<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EcoTrack | Missions</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Using Lucide Icons for a modern, chill vibe -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase_config.js"></script>
    <script src="submit_project.js"></script>
    <script src="../auth_guard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            /* Strict White & Green Palette */
            --primary-green: #02451A;
            --bg-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(2, 69, 26, 0.1);
            --card-shadow: 0 8px 32px -8px rgba(2, 69, 26, 0.1);
            --text-main: #02451A;
            --text-muted: rgba(2, 69, 26, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100svh;
            overflow: hidden;
            position: relative;
        }

        .ambient-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(circle at 15% 50%, rgba(2, 69, 26, 0.05), transparent 50%),
                        radial-gradient(circle at 85% 30%, rgba(2, 69, 26, 0.08), transparent 50%);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100svh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 0 50px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .header {
            padding: 24px 24px 15px 24px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .back-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-green);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 69, 26, 0.05);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: white;
            transform: translateX(-3px);
            box-shadow: 0 6px 15px rgba(2, 69, 26, 0.1);
        }

        .header-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary-green);
        }

        .content-area {
            flex-grow: 1;
            padding: 10px 24px 40px 24px;
            overflow-y: auto;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
        }
        
        .content-area::-webkit-scrollbar {
            display: none;
        }

        /* Tabs */
        .tabs-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 16px;
            border: 2px solid var(--primary-green);
            background: transparent;
            color: var(--primary-green);
            font-family: inherit;
            font-weight: 800;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--primary-green);
            color: white;
            box-shadow: 0 4px 12px rgba(2, 69, 26, 0.2);
        }

        /* Instruction Banner */
        .instruction-banner {
            background: rgba(255, 255, 255, 0.9);
            border: 1px dashed rgba(2, 69, 26, 0.3);
            border-radius: 16px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(2, 69, 26, 0.05);
        }

        .instruction-text {
            font-size: 12px;
            font-weight: 800;
            color: var(--primary-green);
            text-transform: uppercase;
            line-height: 1.4;
            max-width: 100%;
        }

        /* Mission Cards List */
        .missions-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 20px;
        }

        .mission-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: slideIn 0.5s ease backwards;
        }
        
        .mission-card:nth-child(2) { animation-delay: 0.1s; }
        .mission-card:nth-child(3) { animation-delay: 0.2s; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .mission-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-main);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .mission-detail {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }
        
        .mission-detail span {
            color: var(--text-main);
        }

        .points-highlight {
            color: var(--primary-green) !important;
            font-size: 14px;
            font-weight: 800 !important;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .mission-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
            border-top: 1px dashed rgba(2, 69, 26, 0.1);
            padding-top: 15px;
        }
        
        .do-it-btn {
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 69, 26, 0.2);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .do-it-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(2, 69, 26, 0.3);
        }

        /* Camera / Finalization View Specific Styles */
        #cameraSection, #reviewSection {
            gap: 20px;
        }

        .camera-view {
            width: 100%;
            height: 350px;
            background: #111827;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .camera-overlay {
            position: absolute;
            inset: 20px;
            border: 2px dashed rgba(255,255,255,0.4);
            border-radius: 12px;
        }

        .camera-icon {
            width: 48px;
            height: 48px;
            opacity: 0.8;
            margin-bottom: 10px;
        }

        .live-dot {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .summary-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(12px);
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(2, 69, 26, 0.05);
        }

        .summary-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .summary-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .summary-val {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-main);
            text-align: right;
            max-width: 60%;
        }

        .btn-primary {
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(2, 69, 26, 0.25);
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: auto;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(2, 69, 26, 0.35);
        }

        /* Filter Tabs */
        .status-filters {
            display: flex;
            background: rgba(2, 69, 26, 0.05);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .filter-btn {
            flex: 1;
            padding: 10px 0;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: white;
            color: var(--primary-green);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* Modal Styles */
        /* Immersive Camera Styles from Verification */
        .camera-view {
            width: 100%;
            height: 400px;
            background: #111827;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .camera-view.immersive {
            height: 100% !important;
            border-radius: 0;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 50;
        }

        .back-immersive {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 60;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .camera-overlay-top {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 24px;
            z-index: 55;
            pointer-events: none;
        }

        .camera-label {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 10px 24px;
            border-radius: 30px;
            color: white;
            font-size: 14px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .face-overlay {
            position: absolute;
            width: 280px;
            height: 280px;
            z-index: 52;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .face-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: rgba(255, 255, 255, 0.8);
            border-style: solid;
        }

        .corner-tl { top: 0; left: 0; border-width: 4px 0 0 4px; border-top-left-radius: 12px; }
        .corner-tr { top: 0; right: 0; border-width: 4px 4px 0 0; border-top-right-radius: 12px; }
        .corner-bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-bottom-left-radius: 12px; }
        .corner-br { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-bottom-right-radius: 12px; }

        .camera-overlay-bottom {
            position: absolute;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 60;
        }

        .live-dot {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 10px;
            height: 10px;
            background: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            z-index: 60;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .shutter-btn {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 4px solid white;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        .shutter-btn:active { transform: scale(0.9); }
        .shutter-btn::after {
            content: '';
            width: 65px;
            height: 65px;
            background: white;
            border-radius: 50%;
            position: absolute;
        }

        .qr-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(2, 69, 26, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 24px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .qr-modal-overlay.active {
            display: flex;
            opacity: 1;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .qr-modal {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
            animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .qr-modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(2, 69, 26, 0.1);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-green);
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .qr-modal-close:hover {
            background: rgba(2, 69, 26, 0.2);
        }

        .qr-placeholder {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 0 2px rgba(2, 69, 26, 0.1);
        }

    </style>
</head>

<body>

    <div class="ambient-layer"></div>

    <div class="app-container">
        
        <!-- Header -->
        <header class="header">
            <button class="back-btn" id="backBtn" onclick="goBack()">
                <i data-lucide="chevron-left"></i>
            </button>
            <div class="header-title" id="pageTitle">Missions</div>
        </header>

        <!-- MISSION LIST SECTION -->
        <div class="content-area" id="missionListSection">


            <div class="status-filters">
                <button class="filter-btn active" onclick="filterList('all')">All</button>
                <button class="filter-btn" onclick="filterList('pending')">Pending</button>
                <button class="filter-btn" onclick="filterList('completed')">Completed</button>
            </div>

            <div class="instruction-banner">
                <div class="instruction-text">Complete missions to earn points and rewards</div>
            </div>

            <div class="missions-list">
                <!-- Dynamic Content Here -->
                <div style="text-align: center; padding: 40px; color: var(--text-muted);" id="loadingHint">
                    <i data-lucide="loader" style="width: 32px; height: 32px; animation: spin 2s linear infinite;"></i>
                    <p style="margin-top: 10px; font-weight: 700;">FETCHING MISSIONS...</p>
                </div>
            </div>
        </div>

        <!-- CAMERA SECTION (Immersive) -->
        <div class="content-area no-padding" id="cameraSection" style="display: none; height: 100%; position: absolute; top: 0; left: 0; width: 100%; z-index: 50;">
            <div class="camera-view immersive" id="cameraBox">
                <video id="missionVideo" autoplay playsinline style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;"></video>
                <canvas id="missionCanvas" style="display: none;"></canvas>

                <!-- Top Overlays -->
                <button class="back-immersive" onclick="goBack()">
                    <i data-lucide="chevron-left"></i>
                </button>

                <div class="camera-overlay-top">
                    <div class="camera-label">
                        <i data-lucide="eye" style="width: 16px;"></i> Position items in frame
                    </div>
                </div>

                <!-- Frame Overlay -->
                <div class="face-overlay">
                    <div class="face-corner corner-tl"></div>
                    <div class="face-corner corner-tr"></div>
                    <div class="face-corner corner-bl"></div>
                    <div class="face-corner corner-br"></div>
                </div>

                <div class="live-dot"></div>

                <!-- Bottom Overlays -->
                <div class="camera-overlay-bottom">
                    <button class="shutter-btn" onclick="takeMissionSnapshot()"></button>
                </div>
            </div>
        </div>

        <!-- REVIEW SECTION -->
        <div class="content-area" id="reviewSection" style="display: none; flex-direction: column;">
            
            <div class="summary-card">
                <div style="text-align: center; margin-bottom: 20px; font-weight: 700; color: var(--primary-green);">
                    <i data-lucide="check-circle" style="width: 24px; height: 24px; margin-bottom: 5px;"></i><br>
                    Image Captured Successfully
                </div>
                <div class="summary-item">
                    <span class="summary-label">Mission</span>
                    <span class="summary-val" id="summaryTitle">--</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Target Weight</span>
                    <span class="summary-val" id="summaryWeight">--</span>
                </div>
                <div class="summary-item">
                    <span class="summary-label">Reward</span>
                    <span class="summary-val" style="color: var(--primary-green); font-size: 18px;">
                        <i data-lucide="award" style="width: 16px; height: 16px; display: inline-block; vertical-align: middle;"></i> 
                        <span id="summaryPoints">0</span>
                    </span>
                </div>
            </div>

            <button class="btn-primary" onclick="submitMission()">
                Submit for Verification <i data-lucide="check-circle"></i>
            </button>
        </div>

    </div>

    <!-- QR Modal -->
    <div class="qr-modal-overlay" id="qrModal" onclick="closeQRModal(event)">
        <div class="qr-modal">
            <button class="qr-modal-close" onclick="closeQRModal()">
                <i data-lucide="x" style="width: 16px; height: 16px;"></i>
            </button>
            <div style="font-size: 18px; font-weight: 800; color: var(--primary-green); text-align: center;">Verification Code</div>
            <div class="qr-placeholder" id="qrContainer">
                <i data-lucide="qr-code" style="width: 120px; height: 120px; color: var(--primary-green); opacity: 0.8;"></i>
            </div>
            <div id="qrCodeTextDisplay" style="font-size: 24px; font-weight: 800; letter-spacing: 4px; color: var(--text-main); font-family: monospace; background: rgba(2, 69, 26, 0.05); padding: 8px 20px; border-radius: 8px; border: 1px dashed rgba(2, 69, 26, 0.2); margin-top: 5px; margin-bottom: 5px;">----</div>
            <div style="font-size: 13px; font-weight: 600; color: var(--text-muted); text-align: center; line-height: 1.4;">Show this QR code to the admin to verify your activity.</div>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        const listSection = document.getElementById('missionListSection');
        const cameraSection = document.getElementById('cameraSection');
        const reviewSection = document.getElementById('reviewSection');
        const pageTitle = document.getElementById('pageTitle');

        let currentStep = 'list';
        let missions = [];
        let userActivities = [];
        let activeMissionData = { id: '', title: '', weight: '', points: '' };
        let videoStream = null;
        let capturedPhoto = null;

        // Start Sync
        document.addEventListener('DOMContentLoaded', initMissions);

        async function initMissions() {
            const { data: { user } } = await window.supabaseClient.auth.getUser();
            if (!user) return;

            try {
                // 1. Fetch user's mission history from user_projects table
                const { data: actData, error: aError } = await window.supabaseClient
                    .from('user_projects')
                    .select('project_id, status')
                    .eq('user_id', user.id);

                if (aError) throw aError;
                userActivities = actData || [];

                const participantProjectIds = userActivities
                    .map(a => a.project_id)
                    .filter(id => id !== null);

                // 2. Fetch missions: active OR already participated in
                const now = new Date().toISOString().split('T')[0];
                
                let query = window.supabaseClient
                    .from('projects')
                    .select('*')
                    .eq('type', 'Mission');

                // Filter: (active) OR (already participated)
                if (participantProjectIds.length > 0) {
                    const idList = `(${participantProjectIds.join(',')})`;
                    query = query.or(`end_date.gte.${now},id.in.${idList}`);
                } else {
                    query = query.gte('end_date', now);
                }

                const { data: projectsData, error: pError } = await query
                    .order('created_at', { ascending: false });

                if (pError) throw pError;
                missions = projectsData || [];

                renderMissions();
            } catch (err) {
                console.error('Fetch Error:', err);
                document.getElementById('loadingHint').innerHTML = `<p style="color:red">Failed to load missions.</p>`;
            }
        }

        function renderMissions(filter = 'all') {
            const container = document.querySelector('.missions-list');
            container.innerHTML = '';

            const filtered = missions.filter(m => {
                const activity = userActivities.find(a => String(a.project_id) === String(m.id));
                const status = activity ? activity.status : 'not-done';
                if (filter === 'all') return true;
                if (filter === 'pending') return status === 'pending';
                if (filter === 'completed') return status === 'completed' || status === 'approved';
                return false;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:50px; color:var(--text-muted); font-weight:700;">NO MISSIONS FOUND</div>`;
                return;
            }

            filtered.forEach(m => {
                // Find the activity for this specific project
                const activity = userActivities.find(a => String(a.project_id) === String(m.id));
                const status = activity ? activity.status : 'not-done';

                const card = document.createElement('div');
                card.className = 'mission-card';
                card.dataset.status = status;

                let actionBtn = '';
                if (status === 'completed' || status === 'approved') {
                    actionBtn = `<button class="do-it-btn" style="background: var(--text-muted);" disabled>COMPLETED <i data-lucide="check-circle" style="width: 16px; height: 16px;"></i></button>`;
                    card.style.opacity = '0.8';
                } else if (status === 'pending') {
                    actionBtn = `
                        <div style="display:flex; gap:10px; flex-grow:1;">
                            <button class="do-it-btn" style="background: rgba(2, 69, 26, 0.1); color: var(--primary-green); padding: 10px 15px;" onclick="showQRModal('${m.code}')">
                                <i data-lucide="qr-code" style="width: 18px; height: 18px;"></i>
                            </button>
                            <button class="do-it-btn" style="background: #eab308; flex-grow: 1;" disabled>
                                PENDING <i data-lucide="clock" style="width: 16px; height: 16px;"></i>
                            </button>
                        </div>`;
                } else {
                    actionBtn = `<button class="do-it-btn" onclick="startMission('${m.id}', '${m.title}', '${m.target_weight}kg ${m.waste_type || ''}', '${m.points}')">DO IT <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i></button>`;
                }

                card.innerHTML = `
                    <div class="mission-title">${m.title}</div>
                    <div class="mission-detail"><i data-lucide="info" style="width: 14px; height: 14px; margin-top: 2px;"></i> ${m.description}</div>
                    <div class="mission-detail"><i data-lucide="scale" style="width: 14px; height: 14px; margin-top: 2px;"></i> TARGET: <span>${m.target_weight} kg of ${m.waste_type || 'Waste'}</span></div>
                    <div class="mission-detail"><i data-lucide="award" style="width: 14px; height: 14px; margin-top: 2px; color: var(--primary-green);"></i> POINTS REWARD: <span class="points-highlight">${m.points}</span></div>
                    <div class="mission-detail"><i data-lucide="calendar" style="width: 14px; height: 14px; margin-top: 2px;"></i> DEADLINE: <span>${new Date(m.end_date).toLocaleDateString('en-PH', {month:'short',day:'numeric'})}</span></div>
                    <div class="mission-actions">${actionBtn}</div>
                `;
                container.appendChild(card);
            });

            lucide.createIcons();
        }

        function filterList(status) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderMissions(status);
        }

        function showQRModal(code) {
            document.getElementById('qrCodeTextDisplay').textContent = code;
            document.getElementById('qrModal').classList.add('active');
        }

        function closeQRModal(e) {
            if (!e || e.target.id === 'qrModal' || e.currentTarget.classList.contains('qr-modal-close')) {
                document.getElementById('qrModal').classList.remove('active');
            }
        }

        function startMission(id, title, weight, points) {
            // Guard: prevent starting if already taken
            const already = userActivities.find(a => String(a.project_id) === String(id));
            if (already) {
                Swal.fire({ icon: 'info', title: 'Already Submitted', text: `This mission is already ${already.status}.`, confirmButtonColor: '#02451A' });
                return;
            }
            activeMissionData = { id, title, weight, points };
            listSection.style.display = 'none';
            cameraSection.style.display = 'flex';
            pageTitle.textContent = "Take Photo";
            currentStep = 'camera';
            startCamera();
        }

        async function startCamera() {
            const video = document.getElementById('missionVideo');
            const constraints = { video: { facingMode: { ideal: 'environment' } } };
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                videoStream = stream;
                video.srcObject = stream;
            } catch (err) {
                console.error("Camera access denied", err);
                Swal.fire({
                    icon: 'error',
                    title: 'Camera Access Required',
                    text: 'Please allow camera access to take a photo of your waste items.',
                    confirmButtonColor: '#02451A'
                });
                goBack();
            }
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }

        function takeMissionSnapshot() {
            const video = document.getElementById('missionVideo');
            const canvas = document.getElementById('missionCanvas');
            if (!videoStream || !video) return;
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            capturedPhoto = canvas.toDataURL('image/jpeg', 0.8);
            stopCamera();
            showReview();
        }

        function showReview() {
            document.getElementById('summaryTitle').textContent = activeMissionData.title;
            document.getElementById('summaryWeight').textContent = activeMissionData.weight;
            document.getElementById('summaryPoints').textContent = activeMissionData.points;

            cameraSection.style.display = 'none';
            reviewSection.style.display = 'flex';
            pageTitle.textContent = "Finalize Submission";
            currentStep = 'review';
            lucide.createIcons();
        }

        function goBack() {
            if (currentStep === 'review') {
                cameraSection.style.display = 'flex';
                reviewSection.style.display = 'none';
                pageTitle.textContent = "Take Photo";
                currentStep = 'camera';
                startCamera();
            } else if (currentStep === 'camera') {
                stopCamera();
                listSection.style.display = 'flex';
                cameraSection.style.display = 'none';
                pageTitle.textContent = "Missions";
                currentStep = 'list';
            } else {
                window.location.href = 'menu.html';
            }
        }

        async function submitMission() {
            const { data: { user } } = await window.supabaseClient.auth.getUser();
            if (!user) return;

            // Pre-submit guard: check DB directly to prevent duplicate submissions
            const { data: existing } = await window.supabaseClient
                .from('user_projects')
                .select('id, status')
                .eq('user_id', user.id)
                .eq('project_id', activeMissionData.id)
                .maybeSingle();

            if (existing) {
                Swal.fire({ icon: 'warning', title: 'Already Submitted', text: `You have already submitted this mission. Status: ${existing.status}.`, confirmButtonColor: '#02451A' });
                await initMissions();
                listSection.style.display = 'flex';
                reviewSection.style.display = 'none';
                pageTitle.textContent = 'Missions';
                currentStep = 'list';
                return;
            }

            try {
                const { id, error } = await window.submitUserProject({
                    type: 'mission',
                    project_id: activeMissionData.id,
                    submission_data: { photo: capturedPhoto },
                    points: activeMissionData.points,
                    setCode: false
                });

                if (error) {
                    console.error('Submission Error:', error);
                    Swal.fire('Error', 'Submission failed: ' + (error.message || error), 'error');
                    return;
                }

                Swal.fire({
                    icon: 'success',
                    title: 'Submitted!',
                    text: 'Mission is now pending verification.',
                    timer: 2000,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = 'menu.html';
                });
            } catch (e) {
                console.error('Submission Error:', e);
                Swal.fire('Error', 'Submission failed: ' + e.message, 'error');
            }
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EcoTrack - Scan QR</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase_config.js"></script>

    <style>
        :root {
            --primary-green: #02451A;
            --emerald: #10b981;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(2, 69, 26, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000;
            color: var(--primary-green);
            min-height: 100svh; overflow: hidden; position: relative;
        }

        .ambient-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;
            background: radial-gradient(circle at 15% 50%, rgba(16, 185, 129, 0.1), transparent 50%);
        }

        .app-container {
            width: 100%; max-width: 480px; height: 100svh; display: flex; flex-direction: column;
            position: relative; margin: 0 auto; overflow: hidden;
        }

        /* Fullscreen Scanner */
        #reader { width: 100%; height: 100svh; position: absolute; top: 0; left: 0; z-index: 1; background: #000; overflow: hidden; }
        /* Ensure the camera element (video/canvas) covers the whole reader and maintains cover aspect */
        #reader video, #reader canvas, #reader .html5-qrcode-video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: block !important;
        }
        /* Make scanner controls invisible and let overlays sit above video */
        #reader .html5-qrcode-toolbar, #reader .html5-qrcode-scanner__dashboard_section { display: none !important; }

        /* Overlay Header */
        .header { 
            position: absolute; top: 0; left: 0; width: 100%; z-index: 10;
            padding: 24px; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
        }
        
        .btn-back { 
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3); width: 40px; height: 40px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer; color: white;
            transition: all 0.3s ease; text-decoration: none;
        }
        .btn-back:hover { background: rgba(255, 255, 255, 0.3); transform: scale(1.05); }

        .scan-title { font-family: 'Baloo Da 2', cursive; font-size: 1.2rem; font-weight: 800; color: white; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* Scanner Target Frame */
        .scan-frame {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 70%; aspect-ratio: 1/1; border: 2px dashed rgba(255,255,255,0.5); border-radius: 24px; z-index: 5; pointer-events: none;
        }
        .scan-frame::before { content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px; border: 4px solid var(--emerald); border-radius: 24px; clip-path: polygon(0 0, 20% 0, 0 20%, 0 0, 100% 0, 100% 20%, 80% 0, 100% 0, 100% 100%, 80% 100%, 100% 80%, 100% 100%, 0 100%, 0 80%, 20% 100%, 0 100%); animation: scanPulse 2s infinite; }
        
        @keyframes scanPulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* Manual Input Button (Overlay) */
        .btn-toggle-manual {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 14px 24px; border-radius: 30px; font-weight: 800; color: var(--primary-green);
            border: none; display: flex; align-items: center; gap: 8px; cursor: pointer;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3); transition: all 0.3s ease; text-transform: uppercase; font-size: 0.9rem;
        }
        .btn-toggle-manual:hover { transform: translateX(-50%) translateY(-2px); background: white; }

        /* --- MANUAL INPUT UI (Glassmorphism Modal) --- */
        .manual-input-ui {
            position: absolute; bottom: -100%; left: 0; width: 100%; z-index: 20;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-top-left-radius: 30px; border-top-right-radius: 30px; padding: 30px 24px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.2); transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center;
        }
        .manual-input-ui.active { bottom: 0; }

        .modal-drag-handle { width: 50px; height: 5px; background: rgba(2, 69, 26, 0.2); border-radius: 10px; margin: -10px auto 20px auto; }

        .input-group { width: 100%; margin-bottom: 20px; position: relative; }
        .input-group label { display: block; font-size: 0.8rem; font-weight: 800; color: var(--primary-green); margin-bottom: 8px; text-transform: uppercase; }
        .input-field {
            width: 100%; padding: 16px; border-radius: 16px; border: 2px solid var(--glass-border);
            background: white; color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1rem; font-weight: 600; outline: none; transition: border-color 0.3s ease; text-align: center; letter-spacing: 2px;
        }
        .input-field:focus { border-color: var(--emerald); }

        .btn-submit {
            width: 100%; background: var(--primary-green); color: white; border: none; padding: 16px;
            border-radius: 16px; font-weight: 800; font-size: 1rem; cursor: pointer;
            box-shadow: 0 8px 20px rgba(2, 69, 26, 0.2); transition: all 0.3s ease; text-transform: uppercase;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(2, 69, 26, 0.3); }

        .btn-close-manual {
            background: transparent; border: none; color: var(--text-muted); font-weight: 700;
            margin-top: 15px; cursor: pointer; text-decoration: underline; font-size: 0.85rem;
        }

    </style>
</head>
<body>

    <div class="ambient-layer"></div>

    <div class="app-container">
        
        <div id="reader"></div>
        <div class="scan-frame"></div>

        <header class="header">
            <a href="collector_tasks.html" class="btn-back">
                <i data-lucide="chevron-left"></i>
            </a>
            <div class="scan-title">Scan QR Code</div>
            <div style="width:40px;"></div> <!-- Spacer -->
        </header>

        <button class="btn-toggle-manual" onclick="toggleManualInput()">
            <i data-lucide="keyboard"></i> Enter Code Manually
        </button>

        <div class="manual-input-ui" id="manualInputUI">
            <div class="modal-drag-handle"></div>
            
            <div class="input-group">
                <label>Collection Code</label>
                <input type="text" class="input-field" id="manualCode" placeholder="e.g. ECO-12345" autocomplete="off">
            </div>

            <button class="btn-submit" onclick="submitManualCode()">
                Verify Collection <i data-lucide="arrow-right"></i>
            </button>

            <button class="btn-close-manual" onclick="toggleManualInput()">Cancel</button>
        </div>

    </div>

<script>
    lucide.createIcons();

    // Real HTML5 QR Code scanner using camera
    let scannerActive = false;
    let html5QrCode = null;

    async function startScanner() {
        if (html5QrCode) return;
        try {
            html5QrCode = new Html5Qrcode("reader");
            const devices = await Html5Qrcode.getCameras();
            const cameraId = (devices && devices.length)
                ? (devices.find(d => /back|rear|environment/i.test(d.label)) || devices[0]).id
                : null;

            if (!cameraId) {
                console.warn('No camera found');
                await Swal.fire({
                    icon: 'error',
                    title: 'Camera not found',
                    text: 'No camera device is available for scanning QR codes.',
                    confirmButtonColor: '#02451A'
                });
                return;
            }

            const qrboxSize = Math.min(window.innerWidth * 0.7, 400);
            const config = {
                fps: 10,
                qrbox: { width: qrboxSize, height: qrboxSize },
                videoConstraints: { facingMode: { ideal: 'environment' } }
            };
            scannerActive = true;
            await html5QrCode.start(cameraId, config, (decodedText, decodedResult) => {
                // On successful scan
                stopScanner();
                handleSuccessfulScan(decodedText);
            }, (errorMessage) => {
                // Ignore transient scan errors; scanner stays active.
            });
        } catch (e) {
            console.error('Scanner start failed:', e);
            scannerActive = false;
            if (html5QrCode) html5QrCode.clear().catch(()=>{});
            html5QrCode = null;
            await Swal.fire({
                icon: 'error',
                title: 'Camera Access Required',
                text: 'Unable to access camera for scanning. Please allow camera permission and try again.',
                confirmButtonColor: '#02451A'
            });
        }
    }

    async function stopScanner() {
        if (!html5QrCode) return;
        try {
            if (scannerActive) {
                await html5QrCode.stop();
            }
        } catch (e) {
            console.warn('Error stopping scanner:', e);
        }
        try { await html5QrCode.clear(); } catch (e) {
            console.warn('Error clearing scanner:', e);
        }
        html5QrCode = null;
        scannerActive = false;
    }

    function toggleManualInput() {
        const ui = document.getElementById('manualInputUI');
        ui.classList.toggle('active');
        if (ui.classList.contains('active')) {
            stopScanner();
        } else {
            startScanner();
        }
    }

    function submitManualCode() {
        const code = document.getElementById('manualCode').value;
        if (!code) {
            alert('Please enter a collection code.');
            return;
        }
        
        const btn = document.querySelector('.btn-submit');
        const originalContent = btn.innerHTML;
        
        btn.innerHTML = `<i data-lucide="loader" class="spin"></i> Verifying...`;
        lucide.createIcons();
        btn.style.opacity = '0.8';
        
        // Try immediate verification using manual code
        setTimeout(() => {
            handleSuccessfulScan(code);
            btn.innerHTML = originalContent;
            btn.style.opacity = '1';
        }, 600);
    }

    // Start scanner when page loads
    document.addEventListener('DOMContentLoaded', () => {
        startScanner();
    });

    // Clean up scanner when leaving
    window.addEventListener('beforeunload', () => {
        stopScanner();
    });

    async function handleSuccessfulScan(codeText) {
        try {
            const params = new URLSearchParams(window.location.search);
            const activityId = params.get('activity_id');
            if (!activityId) {
                await Swal.fire({
                    icon: 'error',
                    title: 'No activity selected',
                    text: 'Please start scanning from the task list.',
                    confirmButtonColor: '#02451A'
                });
                return window.location.href = 'collector_tasks.html';
            }

            // Load the user_projects row
            const { data: up, error: upErr } = await window.supabaseClient
                .from('user_projects')
                .select('id, user_id, type, project_id, code, status, points')
                .eq('id', activityId)
                .maybeSingle();

            const { data: { user: currentUser }, error: authErr } = await window.supabaseClient.auth.getUser();
            const approverId = currentUser?.id || null;

            if (upErr || !up) {
                console.error('Could not load activity:', upErr);
                await Swal.fire({
                    icon: 'error',
                    title: 'Unable to load task',
                    text: 'The selected task could not be loaded. Please go back and try again.',
                    confirmButtonColor: '#02451A'
                });
                return window.location.href = 'collector_tasks.html';
            }

            const normalizedStatus = String(up.status || '').toLowerCase();
            if (normalizedStatus === 'completed' || normalizedStatus === 'approved') {
                await Swal.fire({
                    icon: 'info',
                    title: 'Already completed',
                    text: 'This task has already been completed and points have been awarded.',
                    confirmButtonColor: '#02451A'
                });
                return window.location.href = 'collector_tasks.html';
            }

            if (up.type === 'mission') {
                // For missions, scanned code must match a project.code and that project's id must equal user_projects.project_id
                const { data: proj, error: projErr } = await window.supabaseClient
                    .from('projects')
                    .select('id, code, points')
                    .eq('code', codeText)
                    .maybeSingle();

                if (projErr || !proj) {
                    await Swal.fire({
                        icon: 'error',
                        title: 'Wrong mission code',
                        text: 'Scanned code does not match this mission.',
                        confirmButtonColor: '#02451A'
                    });
                    await resumeScannerIfNeeded();
                    return;
                }

                if (String(proj.id) !== String(up.project_id)) {
                    await Swal.fire({
                        icon: 'warning',
                        title: 'Task mismatch',
                        text: 'This QR belongs to a different mission than the selected task.',
                        confirmButtonColor: '#02451A'
                    });
                    await resumeScannerIfNeeded();
                    return;
                }

                const earnedPoints = parseFloat(proj.points || 0);
                const { error: completeErr } = await window.supabaseClient
                    .from('user_projects')
                    .update({ status: 'completed', points: earnedPoints, approved_by: approverId })
                    .eq('id', up.id);

                if (completeErr) {
                    console.error('Could not complete mission task:', completeErr);
                    await Swal.fire({
                        icon: 'error',
                        title: 'Could not complete task',
                        text: 'There was an issue marking this mission completed. Please try again.',
                        confirmButtonColor: '#02451A'
                    });
                    return window.location.href = 'collector_tasks.html';
                }

                await window.supabaseClient.from('notifications').insert([{
                    user_id: up.user_id,
                    title: 'Mission completed',
                    description: `You earned ${earnedPoints} points for a completed mission.`,
                    type: 'points-awarded'
                }]);

                await Swal.fire({
                    icon: 'success',
                    title: 'Mission completed',
                    text: `Task verified and ${earnedPoints} points awarded to the user.`,
                    confirmButtonColor: '#02451A'
                });
                return window.location.href = 'collector_tasks.html';
            } else {
                // manual type: scanned code must match user_projects.code and task must not already be approved
                if (!up.code) {
                    await Swal.fire({
                        icon: 'error',
                        title: 'No manual code found',
                        text: 'This manual submission does not have a code to verify.',
                        confirmButtonColor: '#02451A'
                    });
                    return window.location.href = 'collector_tasks.html';
                }

                if (String(up.code).trim() !== String(codeText).trim()) {
                    await Swal.fire({
                        icon: 'error',
                        title: 'Wrong manual code',
                        text: 'Scanned code does not match this manual submission.',
                        confirmButtonColor: '#02451A'
                    });
                    await resumeScannerIfNeeded();
                    return;
                }

                const earnedPoints = parseFloat(up.points || 0);
                const { error: completeErr } = await window.supabaseClient
                    .from('user_projects')
                    .update({ status: 'approved', points: earnedPoints, approved_by: approverId })
                    .eq('id', up.id);

                if (completeErr) {
                    console.error('Could not approve manual task:', completeErr);
                    await Swal.fire({
                        icon: 'error',
                        title: 'Could not approve task',
                        text: 'There was an issue marking this manual submission approved. Please try again.',
                        confirmButtonColor: '#02451A'
                    });
                    return window.location.href = 'collector_tasks.html';
                }

                await window.supabaseClient.from('notifications').insert([{
                    user_id: up.user_id,
                    title: 'Manual submission approved',
                    description: `You earned ${earnedPoints} points for an approved manual submission.`,
                    type: 'points-awarded'
                }]);

                await Swal.fire({
                    icon: 'success',
                    title: 'Manual submission approved',
                    text: `Task verified and ${earnedPoints} points awarded to the user.`,
                    confirmButtonColor: '#02451A'
                });
                return window.location.href = 'collector_tasks.html';
            }
        } catch (e) {
            console.error('Verification error:', e);
            await Swal.fire({
                icon: 'error',
                title: 'Verification failed',
                text: 'An error occurred while checking the code. Please try again.',
                confirmButtonColor: '#02451A'
            });
            await resumeScannerIfNeeded();
            return;
        }
    }

    async function resumeScannerIfNeeded() {
        if (!scannerActive) {
            await startScanner();
        }
    }

</script>
</body>
</html>

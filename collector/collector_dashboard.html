<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EcoTrack - Collector Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase_config.js"></script>
    <script src="../auth_guard.js"></script>

    <style>
        :root {
            --primary-green: #02451A;
            --emerald: #10b981;
            --bg-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(2, 69, 26, 0.1);
            --card-shadow: 0 8px 32px -8px rgba(2, 69, 26, 0.1);
            --text-main: #02451A;
            --text-muted: rgba(2, 69, 26, 0.6);
            --pending-red: #e53935;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
            min-height: 100svh; overflow: hidden; position: relative;
        }

        .ambient-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;
            background: radial-gradient(circle at 15% 50%, rgba(2, 69, 26, 0.05), transparent 50%),
                        radial-gradient(circle at 85% 30%, rgba(2, 69, 26, 0.08), transparent 50%);
        }

        .app-container {
            width: 100%; max-width: 480px; height: 100svh; display: flex; flex-direction: column;
            position: relative; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); box-shadow: 0 0 50px rgba(0,0,0,0.05); overflow: hidden;
        }

        /* --- HEADER --- */
        .header { padding: 24px 24px 15px 24px; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
        .logo-text { font-family: 'Baloo Da 2', cursive; color: var(--primary-green); font-size: 1.4rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .btn-icon { background: var(--glass-bg); border: 1px solid var(--glass-border); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; color: var(--primary-green); box-shadow: 0 4px 12px rgba(2, 69, 26, 0.05); transition: all 0.3s ease; text-decoration: none; position: relative; }
        .btn-icon:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(2, 69, 26, 0.1); background: white; }
        .notif-badge { position: absolute; top: 0; right: 0; width: 10px; height: 10px; background: var(--pending-red); border-radius: 50%; border: 2px solid white; }

        /* --- CONTENT --- */
        .content-area { flex-grow: 1; overflow-y: auto; padding: 10px 24px 120px 24px; scrollbar-width: none; }
        .content-area::-webkit-scrollbar { display: none; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .glass-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 15px; box-shadow: var(--card-shadow); backdrop-filter: blur(12px); display: flex; flex-direction: column; align-items: center; text-align: center; }
        .stat-value { font-family: 'Baloo Da 2', cursive; font-size: 1.6rem; font-weight: 800; color: var(--primary-green); line-height: 1.1; }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-top: 5px; }

        /* Chart */
        .chart-card { padding: 20px; margin-bottom: 24px; width: 100%; align-items: flex-start; }
        .section-title { font-size: 1.1rem; font-weight: 800; color: var(--primary-green); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        /* Requests List */
        .task-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 20px; margin-bottom: 15px; box-shadow: var(--card-shadow); backdrop-filter: blur(12px);
            position: relative; transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .task-card:hover { transform: translateY(-2px); box-shadow: 0 12px 35px -8px rgba(2, 69, 26, 0.15); }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .user-name { font-weight: 800; color: var(--text-main); font-size: 1.1rem; }
        .distance-badge { background: rgba(2, 69, 26, 0.08); padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; color: var(--primary-green); }
        
        .card-details { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px; line-height: 1.5; font-weight: 500; width: 70%; }
        .card-details b { color: var(--primary-green); font-weight: 800; }
        .sub-text { font-size: 0.75rem; color: rgba(2, 69, 26, 0.4); display: block; margin-top: 6px; font-weight: 600; }

        .btn-accept {
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            background: var(--primary-green); color: white; border: none; padding: 12px;
            border-radius: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(2, 69, 26, 0.2);
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; width: 45px; height: 45px;
        }
        .btn-accept:hover { transform: translateY(-55%) scale(1.05); box-shadow: 0 12px 25px rgba(2, 69, 26, 0.3); }

        /* --- BOTTOM NAV --- */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px 30px 25px 30px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(25px); border-top: 1px solid rgba(2, 69, 26, 0.1);
            display: flex; justify-content: space-between; align-items: center; border-radius: 35px 35px 0 0;
            box-shadow: 0 -5px 40px rgba(2, 69, 26, 0.08); z-index: 20;
        }
        .nav-btn {
            background: transparent; border: none; display: flex; flex-direction: column; align-items: center; gap: 6px;
            font-family: inherit; color: var(--text-muted); cursor: pointer; transition: all 0.3s ease; position: relative; text-decoration: none;
        }
        .nav-btn.active { color: var(--primary-green); }
        .nav-icon { width: 24px; height: 24px; stroke-width: 2.2px; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .nav-btn:hover .nav-icon, .nav-btn.active .nav-icon { transform: translateY(-3px); }
        .nav-btn.active::after { content: ''; position: absolute; bottom: -8px; width: 5px; height: 5px; background: var(--primary-green); border-radius: 50%; }
        .nav-text { font-size: 0.75rem; font-weight: 700; }

    </style>
</head>
<body>

    <div class="ambient-layer"></div>

    <div class="app-container">
        
        <header class="header">
            <div class="logo-text">Dashboard</div>
            <a href="collector_notifications.html" class="btn-icon">
                <i data-lucide="bell" style="width: 20px; height: 20px;"></i>
                <span class="notif-badge"></span>
            </a>
        </header>

        <main class="content-area">
            <div class="stats-grid">
                <div class="glass-card">
                    <div class="stat-value">12</div> 
                    <div class="stat-label">Pickups</div>
                </div>
                <div class="glass-card">
                    <div class="stat-value">45.2<span style="font-size:0.9rem">kg</span></div>
                    <div class="stat-label">Collected</div>
                </div>
                <div class="glass-card">
                    <div class="stat-value" style="color:var(--pending-red)">3</div>
                    <div class="stat-label">Pending</div>
                </div>
            </div>

            <div class="glass-card chart-card">
                <div class="section-title"><i data-lucide="bar-chart-3" style="width: 20px; height: 20px;"></i> Weekly Activity</div>
                <div style="height: 160px; width: 100%;">
                    <canvas id="collectionChart"></canvas>
                </div>
            </div>

            <div class="request-container">
                <div class="section-title"><i data-lucide="map-pin" style="width: 20px; height: 20px;"></i> Nearby Requests</div>
                
                <!-- Static Placeholder Requests -->
                <div class="task-card">
                    <div class="card-header">
                        <div class="user-name">Juan Dela Cruz</div>
                        <div class="distance-badge">1.2 km</div>
                    </div>
                    <div class="card-details">
                        <div><b>Mission:</b> 5.0kg Plastic Bottles</div>
                        <span class="sub-text">Activity ID: #10042 | Just now</span>
                    </div>
                    <button class="btn-accept" onclick="acceptJob(10042)">
                        <i data-lucide="chevron-right"></i>
                    </button>
                </div>

                <div class="task-card">
                    <div class="card-header">
                        <div class="user-name">Maria Clara</div>
                        <div class="distance-badge">2.5 km</div>
                    </div>
                    <div class="card-details">
                        <div><b>Manual:</b> 2.3kg Paper/Cardboard</div>
                        <span class="sub-text">Activity ID: #10041 | 2 hours ago</span>
                    </div>
                    <button class="btn-accept" onclick="acceptJob(10041)">
                        <i data-lucide="chevron-right"></i>
                    </button>
                </div>

            </div>
        </main>

        <nav class="bottom-nav">
            <a href="collector_dashboard.html" class="nav-btn active">
                <i data-lucide="layout-dashboard" class="nav-icon"></i>
            </a>
            
            <a href="collector_tasks.html" class="nav-btn">
                <i data-lucide="clipboard-list" class="nav-icon"></i>
            </a>
           
            <a href="collector_profile.html" class="nav-btn">
                <i data-lucide="user" class="nav-icon"></i>
            </a>
        </nav>
    </div>

<script>
    lucide.createIcons();



    // --- Accept Job Flow ---
    function acceptJob(activityId) {
        console.log(`Accepting job with ID: ${activityId}`);
        window.location.href = 'collector_tasks.html'; 
    }

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
        // Initialization ng Chart
        const ctx = document.getElementById('collectionChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['M', 'T', 'W', 'T', 'F', 'S', 'S'],
                datasets: [{
                    label: 'Pickups',
                    data: [2, 5, 3, 7, 4, 8, 12], 
                    backgroundColor: '#02451A',
                    borderRadius: 8,
                    barThickness: 18
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { display: false, beginAtZero: true },
                    x: { grid: { display: false }, border: {display: false} }
                }
            }
        });
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EcoTrack Collector | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-green: #02451A;
            --forest-dark: #035e24;
            --emerald: #10b981;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.6);
            --transition-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --text-shadow: 0px 1px 2px rgba(0, 0, 0, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Baloo Da 2', cursive;
            background-color: #f0fdf4;
            color: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100svh;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* --- Background --- */
        .ambient-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
            animation: drift 15s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 60vw;
            height: 60vw;
            background: #dcfce7;
            top: -10%;
            right: -10%;
        }

        .blob-2 {
            width: 70vw;
            height: 70vw;
            background: #a7f3d0;
            bottom: -10%;
            left: -10%;
            animation-delay: -5s;
        }

        @keyframes drift {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(5%, 5%) scale(1.1);
            }
        }

        /* --- Glassmorphism Card --- */
        .glass-card {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(2, 69, 26, 0.15);
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 0.8s var(--transition-smooth) forwards;
        }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
        }

        .logo-img {
            width: 90px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 10px 15px rgba(2, 69, 26, 0.15));
        }

        .page-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: var(--text-shadow);
        }

        .page-subtitle {
            font-size: 15px;
            font-weight: 600;
            color: #4b5563;
        }

        /* --- Form Section --- */
        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
        }

        .input-group label {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-green);
            margin-left: 5px;
        }

        .input-field {
            width: 100%;
            padding: 16px 20px;
            padding-right: 50px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 500;
            color: #111827;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(2, 69, 26, 0.1);
            border-radius: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 4px rgba(2, 69, 26, 0.1);
        }

        /* --- Password Toggle Eye --- */
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50px;
            cursor: pointer;
            color: var(--primary-green);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: opacity 0.2s;
            width: 24px;
            height: 24px;
        }

        .password-toggle:hover {
            opacity: 1;
        }

        .forgot-link {
            text-align: right;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-green);
            text-decoration: none;
            margin-top: -10px;
        }

        .btn-action {
            width: 100%;
            background-color: var(--primary-green);
            color: white;
            font-family: inherit;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 16px 0;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(2, 69, 26, 0.2);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-action:hover {
            background-color: var(--forest-dark);
            transform: translateY(-2px);
        }

        .outro {
            animation: slideDownFade 0.5s var(--transition-smooth) forwards !important;
        }

        @keyframes slideDownFade {
            to {
                opacity: 0;
                transform: translateY(30px);
            }
        }

        @media (max-height: 600px) {
            .glass-card {
                padding: 30px 20px;
            }

            .logo-img {
                width: 70px;
                margin-bottom: 5px;
            }

            .password-toggle {
                top: 38px;
            }
        }
    </style>
</head>

<body>

    <div class="ambient-layer">
        <div class="ambient-blob blob-1"></div>
        <div class="ambient-blob blob-2"></div>
    </div>

    <div class="glass-card" id="loginCard">

        <div class="header-section">
            <img src="image/logo.png" alt="EcoTrack Logo" class="logo-img">
            <h1 class="page-title">Collector Login</h1>
            <p class="page-subtitle">Log in to access your dashboard</p>
        </div>

        <form class="login-form" id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="input-field" placeholder="collector@example.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="input-field" placeholder="••••••••" required>
                
                <div class="password-toggle" onclick="togglePassword()">
                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </div>
            </div>

            <a href="#" class="forgot-link">Forgot password?</a>

            <button type="submit" class="btn-action" id="loginBtn">Log In</button>
        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase_config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');

            if (!email || !password) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Missing Credentials',
                    text: 'Please enter both email and password before logging in.',
                });
                return;
            }

            // Provide visual feedback during loading
            loginBtn.innerText = 'Verifying...';
            loginBtn.disabled = true;

            // 1. Perform Supabase Auth
            const { data: authData, error: authError } = await window.supabaseClient.auth.signInWithPassword({
                email,
                password
            });

            if (authError) {
                console.error('Collector login authError:', authError);
                
                // Enhanced error handling to point out verification issues
                let errorMessage = authError.message || 'Login failed.';
                if (errorMessage.toLowerCase().includes('invalid login credentials')) {
                    errorMessage = 'Invalid email/password, OR your account is not verified yet. Please check your Supabase dashboard.';
                }
                
                handleLoginFailure(errorMessage);
                loginBtn.innerText = 'Log In';
                loginBtn.disabled = false;
                return;
            }

            // 2. Check Role and pass_code in Profiles
            const userId = authData.user?.id;
            if (!userId) {
                handleLoginFailure('Unable to verify user after login.');
                loginBtn.innerText = 'Log In';
                loginBtn.disabled = false;
                return;
            }

            const { data: profile, error: profileError } = await window.supabaseClient
                .from('profiles')
                .select('role, pass_code')
                .eq('id', userId)
                .single();

            const isCollector = profile && profile.role && profile.role.toString().toLowerCase().trim() === 'collector';
            const passCodeMatches = profile && profile.pass_code === password;

            if (profileError || !profile || !isCollector || !passCodeMatches) {
                await window.supabaseClient.auth.signOut();
                
                const message = profileError?.message ||
                    (!profile ? 'No profile found for this user.' :
                        !isCollector ? 'This portal is only available to Collector accounts.' :
                            'Password mismatch for collector profile.');

                Swal.fire({
                    icon: 'warning',
                    title: 'Access Denied',
                    text: message,
                });
                
                loginBtn.innerText = 'Log In';
                loginBtn.disabled = false;
                return;
            }

            // Success Animation and Redirect
            loginBtn.innerText = 'Success!';
            document.getElementById('loginCard').classList.add('outro');
            setTimeout(() => {
                window.location.href = "collector_dashboard.html";
            }, 500);
        });

        function handleLoginFailure(message) {
            Swal.fire({
                icon: 'error',
                title: 'Login Failed',
                text: message,
                confirmButtonColor: '#02451A'
            });
        }
    </script>
</body>

</html>
